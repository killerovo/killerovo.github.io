<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>解压魔方</title>
    <link rel="icon" type="image/x-icon" href="static/assets/favicon.ico" />
    <link type="text/css" href="static/css/main.css" rel="stylesheet" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        .cube-page {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: calc(var(--nav-height) + 32px) 24px 48px;
        }

        .cube-stage {
            width: min(420px, 85vw);
            height: min(420px, 85vw);
            position: relative;
            cursor: grab;
        }

        .cube-stage:active { cursor: grabbing; }

        .cube-stage canvas {
            display: block;
            width: 100% !important;
            height: 100% !important;
        }

        .cube-hint {
            margin-top: 24px;
            font-size: 14px;
            color: var(--text-tertiary);
            text-align: center;
            letter-spacing: 0.02em;
        }

        .cube-back {
            display: inline-block;
            margin-top: 16px;
            color: var(--text-tertiary);
            font-size: 14px;
            text-decoration: none;
            transition: color var(--ease-out);
        }

        .cube-back:hover { color: var(--accent); }

        @media (max-width: 480px) {
            .cube-stage {
                width: 88vw;
                height: 88vw;
            }
        }
    </style>
</head>
<body>

    <!-- Navigation -->
    <nav class="nav" id="mainNav">
        <div class="nav-inner">
            <a class="nav-brand" href="index.html">Li Zhijiang</a>
            <div style="display:flex;align-items:center;gap:12px;">
                <a href="index.html" style="font-size:13px;color:var(--text-tertiary);">← 返回主页</a>
                <button class="theme-toggle" id="themeToggle" aria-label="切换明暗主题">
                    <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="5"/>
                        <line x1="12" y1="1" x2="12" y2="3"/>
                        <line x1="12" y1="21" x2="12" y2="23"/>
                        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
                        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
                        <line x1="1" y1="12" x2="3" y2="12"/>
                        <line x1="21" y1="12" x2="23" y2="12"/>
                        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
                        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
                    </svg>
                    <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                    </svg>
                </button>
            </div>
        </div>
    </nav>

    <!-- Cube -->
    <main class="cube-page">
        <div class="cube-stage" id="cube-stage"></div>
        <p class="cube-hint" id="cube-status">准备打乱…</p>
        <a href="index.html" class="cube-back">← 返回主页</a>
    </main>

    <script>
    (function() {
        var container = document.getElementById('cube-stage');
        var statusEl = document.getElementById('cube-status');
        if (!container) return;

        // ---- Colors ----
        var COLORS = {
            R: 0xb71234, // red
            L: 0xff5800, // orange
            U: 0xffffff, // white
            D: 0xffd500, // yellow
            F: 0x009b48, // green
            B: 0x0046ad, // blue
            inner: 0x111111
        };

        var CUBIE_SIZE = 0.85;
        var GAP = 0.08;
        var STICKER_SIZE = 0.7;
        var STICKER_DEPTH = 0.02;
        var cubies = [];
        var scene, camera, renderer, pivot;

        // ---- Three.js Setup ----
        function initThree() {
            var size = container.clientWidth || 400;
            scene = new THREE.Scene();

            camera = new THREE.PerspectiveCamera(35, size / size, 0.1, 50);
            camera.position.set(7, 5.5, 8);
            camera.lookAt(0, 0, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(size, size);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            container.appendChild(renderer.domElement);

            // Lighting
            scene.add(new THREE.AmbientLight(0xffffff, 0.55));
            var key = new THREE.DirectionalLight(0xffffff, 0.7);
            key.position.set(8, 12, 6);
            scene.add(key);
            var fill = new THREE.DirectionalLight(0xffffff, 0.35);
            fill.position.set(-5, 2, -4);
            scene.add(fill);
            var rim = new THREE.DirectionalLight(0xffffff, 0.25);
            rim.position.set(0, -3, 8);
            scene.add(rim);

            // Pivot group
            pivot = new THREE.Group();
            scene.add(pivot);

            // Build cube
            buildCube();

            // Orbit controls (simple drag)
            setupDrag();

            window.addEventListener('resize', function() {
                var s = container.clientWidth || 400;
                camera.aspect = s / s;
                camera.updateProjectionMatrix();
                renderer.setSize(s, s);
            });
        }

        // ---- Build 27 cubies (skip center) ----
        function buildCube() {
            cubies = [];
            // Remove old cubies from scene
            while(pivot.children.length > 0) {
                pivot.remove(pivot.children[0]);
            }
            while(scene.children.length > 5) { // keep lights + pivot
                var c = scene.children[5];
                if (c === pivot) { break; }
                scene.remove(c);
            }

            for (var x = -1; x <= 1; x++) {
                for (var y = -1; y <= 1; y++) {
                    for (var z = -1; z <= 1; z++) {
                        if (x === 0 && y === 0 && z === 0) continue; // skip center
                        var cubie = createCubie(x, y, z);
                        cubie.userData = { ix: x, iy: y, iz: z };
                        scene.add(cubie);
                        cubies.push(cubie);
                    }
                }
            }
        }

        function createCubie(cx, cy, cz) {
            var group = new THREE.Group();

            // Black body
            var bodyGeo = new THREE.BoxGeometry(CUBIE_SIZE, CUBIE_SIZE, CUBIE_SIZE);
            var bodyMat = new THREE.MeshStandardMaterial({
                color: 0x0a0a0a,
                roughness: 0.8,
                metalness: 0.1
            });
            var body = new THREE.Mesh(bodyGeo, bodyMat);
            group.add(body);

            // Colored stickers on each face
            var stickerGeo = new THREE.PlaneGeometry(STICKER_SIZE, STICKER_SIZE);

            var faces = [
                { axis: 'x', val: 1, color: COLORS.R, pos: [ (CUBIE_SIZE/2 + STICKER_DEPTH), 0, 0 ], rot: [0, Math.PI/2, 0] },
                { axis: 'x', val: -1, color: COLORS.L, pos: [-(CUBIE_SIZE/2 + STICKER_DEPTH), 0, 0 ], rot: [0, -Math.PI/2, 0] },
                { axis: 'y', val: 1, color: COLORS.U, pos: [0, (CUBIE_SIZE/2 + STICKER_DEPTH), 0 ], rot: [-Math.PI/2, 0, 0] },
                { axis: 'y', val: -1, color: COLORS.D, pos: [0, -(CUBIE_SIZE/2 + STICKER_DEPTH), 0 ], rot: [Math.PI/2, 0, 0] },
                { axis: 'z', val: 1, color: COLORS.F, pos: [0, 0, (CUBIE_SIZE/2 + STICKER_DEPTH) ], rot: [0, 0, 0] },
                { axis: 'z', val: -1, color: COLORS.B, pos: [0, 0, -(CUBIE_SIZE/2 + STICKER_DEPTH) ], rot: [0, Math.PI, 0] }
            ];

            faces.forEach(function(f) {
                var mat = new THREE.MeshStandardMaterial({
                    color: f.color,
                    roughness: 0.3,
                    metalness: 0.05
                });
                var sticker = new THREE.Mesh(stickerGeo, mat);
                sticker.position.set(f.pos[0], f.pos[1], f.pos[2]);
                sticker.rotation.set(f.rot[0], f.rot[1], f.rot[2]);
                group.add(sticker);

                // Thin black border around sticker (slightly larger dark plane behind)
                var borderGeo = new THREE.PlaneGeometry(STICKER_SIZE + 0.04, STICKER_SIZE + 0.04);
                var borderMat = new THREE.MeshStandardMaterial({
                    color: 0x111111,
                    roughness: 0.5,
                    metalness: 0.1
                });
                var border = new THREE.Mesh(borderGeo, borderMat);
                border.position.copy(sticker.position);
                border.position.set(
                    f.pos[0] - (f.pos[0] > 0 ? 0.005 : f.pos[0] < 0 ? -0.005 : 0),
                    f.pos[1] - (f.pos[1] > 0 ? 0.005 : f.pos[1] < 0 ? -0.005 : 0),
                    f.pos[2] - (f.pos[2] > 0 ? 0.005 : f.pos[2] < 0 ? -0.005 : 0)
                );
                border.rotation.copy(sticker.rotation);
                // Insert border before sticker so sticker is on top
                group.add(border);
            });

            group.position.set(cx * (CUBIE_SIZE + GAP), cy * (CUBIE_SIZE + GAP), cz * (CUBIE_SIZE + GAP));
            return group;
        }

        // ---- Face Rotation Logic ----
        function getCubiesOnFace(axis, layer) {
            // layer: -1, 0, or 1 for that axis
            var result = [];
            var threshold = 0.3;
            cubies.forEach(function(c) {
                var wp = new THREE.Vector3();
                c.getWorldPosition(wp);
                // Transform world position back relative to scene origin
                // Since cubies are direct children of scene (or pivot), world pos works
                var coord = axis === 'x' ? wp.x : (axis === 'y' ? wp.y : wp.z);
                var target = layer * (CUBIE_SIZE + GAP);
                if (Math.abs(coord - target) < threshold) {
                    result.push(c);
                }
            });
            return result;
        }

        // ---- Animation State ----
        var isAnimating = false;
        var moveQueue = [];
        var currentMove = null;
        var animProgress = 0;
        var animDuration = 200; // ms per move
        var animStartTime = 0;

        // Move history for solving
        var moveHistory = [];

        // Sequence state
        var mode = 'idle'; // idle | scramble | pause-before-solve | solve | pause-before-scramble
        var sequenceTimer = null;
        var SCRAMBLE_MOVES = 22;
        var PAUSE_AFTER_SCRAMBLE = 1500;
        var PAUSE_AFTER_SOLVE = 2000;

        function getOppositeMove(move) {
            return {
                axis: move.axis,
                layer: move.layer,
                angle: -move.angle
            };
        }

        function randomMove(lastMove) {
            var axes = ['x', 'y', 'z'];
            var layers = [-1, 0, 1];
            var angles = [Math.PI / 2, -Math.PI / 2];

            // Pick random axis, layer, angle
            var axis, layer, angle;
            for (var attempt = 0; attempt < 20; attempt++) {
                axis = axes[Math.floor(Math.random() * 3)];
                layer = layers[Math.floor(Math.random() * 3)];
                angle = angles[Math.floor(Math.random() * 2)];

                // Avoid repeating same face
                if (lastMove && lastMove.axis === axis && lastMove.layer === layer) continue;
                // Avoid opposite of last move
                if (lastMove && lastMove.axis === axis && lastMove.layer === layer) continue;
                // Avoid same-axis adjacent layers in same direction (they cancel)
                if (lastMove && lastMove.axis === axis && lastMove.angle === -angle && lastMove.layer !== layer) continue;

                break;
            }

            return { axis: axis, layer: layer, angle: angle };
        }

        // ---- Execute a single move (no animation, instant) ----
        function applyMoveInstant(move) {
            var face = getCubiesOnFace(move.axis, move.layer);
            // Use a temp pivot
            var tempPivot = new THREE.Group();
            scene.add(tempPivot);

            face.forEach(function(c) {
                tempPivot.attach(c);
            });

            // Apply rotation
            if (move.axis === 'x') tempPivot.rotation.x = move.angle;
            if (move.axis === 'y') tempPivot.rotation.y = move.angle;
            if (move.axis === 'z') tempPivot.rotation.z = move.angle;

            // Detach back
            while(tempPivot.children.length > 0) {
                scene.attach(tempPivot.children[0]);
            }
            scene.remove(tempPivot);
        }

        // ---- Start an animated move ----
        function startMove(move, duration, callback) {
            currentMove = move;
            animProgress = 0;
            animDuration = duration;
            animStartTime = performance.now();
            isAnimating = true;

            // Find cubies and attach to pivot
            var face = getCubiesOnFace(move.axis, move.layer);
            face.forEach(function(c) {
                pivot.attach(c);
            });

            // Reset pivot rotation
            pivot.rotation.set(0, 0, 0);

            // Store callback
            currentMove._callback = callback;
            currentMove._face = face;
        }

        function finishCurrentMove() {
            if (!currentMove) return;

            // Apply full rotation
            var move = currentMove;
            if (move.axis === 'x') pivot.rotation.x = move.angle;
            if (move.axis === 'y') pivot.rotation.y = move.angle;
            if (move.axis === 'z') pivot.rotation.z = move.angle;

            // Detach cubies back to scene
            while(pivot.children.length > 0) {
                scene.attach(pivot.children[0]);
            }
            pivot.rotation.set(0, 0, 0);

            isAnimating = false;
            var cb = currentMove._callback;
            currentMove = null;

            if (cb) cb();
        }

        // ---- Drag to orbit ----
        function setupDrag() {
            var isDragging = false;
            var prev = { x: 0, y: 0 };
            var yaw = 0, pitch = 0;
            var targetYaw = 0, targetPitch = 0;
            var autoYaw = 0;

            renderer.domElement.addEventListener('mousedown', function(e) {
                isDragging = true;
                prev.x = e.clientX;
                prev.y = e.clientY;
            });

            window.addEventListener('mousemove', function(e) {
                if (!isDragging) return;
                var dx = e.clientX - prev.x;
                var dy = e.clientY - prev.y;
                targetYaw += dx * 0.005;
                targetPitch += dy * 0.005;
                targetPitch = Math.max(-1.2, Math.min(1.2, targetPitch));
                prev.x = e.clientX;
                prev.y = e.clientY;
            });

            window.addEventListener('mouseup', function() { isDragging = false; });

            renderer.domElement.addEventListener('touchstart', function(e) {
                if (e.touches.length === 1) {
                    isDragging = true;
                    prev.x = e.touches[0].clientX;
                    prev.y = e.touches[0].clientY;
                }
            }, { passive: true });

            window.addEventListener('touchmove', function(e) {
                if (!isDragging || e.touches.length !== 1) return;
                var dx = e.touches[0].clientX - prev.x;
                var dy = e.touches[0].clientY - prev.y;
                targetYaw += dx * 0.005;
                targetPitch += dy * 0.005;
                targetPitch = Math.max(-1.2, Math.min(1.2, targetPitch));
                prev.x = e.touches[0].clientX;
                prev.y = e.touches[0].clientY;
            }, { passive: true });

            window.addEventListener('touchend', function() { isDragging = false; });

            // Camera orbit in render loop
            function updateCamera() {
                yaw += (targetYaw - yaw) * 0.1;
                pitch += (targetPitch - pitch) * 0.1;
                autoYaw += 0.0015;

                var r = 10;
                var cy = Math.sin(pitch) * r;
                var h = Math.cos(pitch) * r;
                var cx = Math.sin(yaw + autoYaw) * h;
                var cz = Math.cos(yaw + autoYaw) * h;

                camera.position.lerp(
                    new THREE.Vector3(cx, cy, cz),
                    0.05
                );
                camera.lookAt(0, 0, 0);
            }

            // Hook into main animation loop
            var origAnimate = animate;
            // We'll just add the camera update to the animate function
            animate = function(t) {
                updateCamera();
                origAnimate(t);
            };
        }

        // ---- Main Loop ----
        function animate(time) {
            requestAnimationFrame(animate);

            // Handle animation
            if (isAnimating && currentMove) {
                var elapsed = time - animStartTime;
                animProgress = Math.min(1, elapsed / animDuration);

                // Ease in-out
                var t = animProgress < 0.5
                    ? 2 * animProgress * animProgress
                    : 1 - Math.pow(-2 * animProgress + 2, 2) / 2;

                var angle = currentMove.angle * t;
                if (currentMove.axis === 'x') pivot.rotation.x = angle;
                if (currentMove.axis === 'y') pivot.rotation.y = angle;
                if (currentMove.axis === 'z') pivot.rotation.z = angle;

                if (animProgress >= 1) {
                    finishCurrentMove();
                }
            }

            renderer.render(scene, camera);
        }

        // ---- Sequence: Scramble → Solve → Loop ----
        function startSequence() {
            mode = 'scramble';
            moveHistory = [];
            statusEl.textContent = '打乱中…';

            // Generate scramble moves
            var lastMove = null;
            for (var i = 0; i < SCRAMBLE_MOVES; i++) {
                var m = randomMove(lastMove);
                moveHistory.push(m);
                lastMove = m;
            }

            // Play scramble
            playMoveList(moveHistory.slice(), 150, function() {
                mode = 'pause-before-solve';
                statusEl.textContent = '拼好啦…';
                sequenceTimer = setTimeout(startSolve, PAUSE_AFTER_SCRAMBLE);
            });
        }

        function startSolve() {
            mode = 'solve';
            statusEl.textContent = '还原中…';

            // Reverse the history
            var solveMoves = moveHistory.slice().reverse().map(getOppositeMove);

            playMoveList(solveMoves, 200, function() {
                mode = 'pause-before-scramble';
                statusEl.textContent = '六面还原！';
                sequenceTimer = setTimeout(startSequence, PAUSE_AFTER_SOLVE);
            });
        }

        function playMoveList(moves, speed, done) {
            var i = 0;
            function next() {
                if (i >= moves.length) {
                    if (done) done();
                    return;
                }
                var m = moves[i];
                i++;
                startMove(m, speed, next);
            }
            next();
        }

        // ---- Init ----
        initThree();

        // Start the sequence after a short delay
        setTimeout(startSequence, 800);
        statusEl.textContent = '准备打乱…';

        requestAnimationFrame(animate);

        // ---- Theme + Nav ----
        (function() {
            var html = document.documentElement;
            var toggle = document.getElementById('themeToggle');
            function getTheme() {
                var s = localStorage.getItem('theme');
                return s || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
            }
            function apply(t) {
                if (t === 'light') html.setAttribute('data-theme', 'light');
                else html.removeAttribute('data-theme');
            }
            apply(getTheme());
            if (toggle) {
                toggle.addEventListener('click', function() {
                    var n = html.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
                    apply(n);
                    localStorage.setItem('theme', n);
                });
            }
            window.matchMedia('(prefers-color-scheme: light)').addEventListener('change', function(e) {
                if (!localStorage.getItem('theme')) apply(e.matches ? 'light' : 'dark');
            });
            var nav = document.getElementById('mainNav');
            window.addEventListener('scroll', function() {
                nav.classList.toggle('scrolled', window.scrollY > 10);
            }, { passive: true });
        })();
    })();
    </script>
</body>
</html>
