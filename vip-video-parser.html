<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIP视频解析</title>

    <link rel="icon" type="image/x-icon" href="static/assets/favicon.ico" />
    <link type="text/css" href="static/css/main.css" rel="stylesheet" />
</head>
<body>

    <!-- Navigation -->
    <nav class="nav" id="mainNav">
        <div class="nav-inner">
            <a class="nav-brand" href="index.html">Li Zhijiang</a>
            <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark/light mode">
                <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="5"/>
                    <line x1="12" y1="1" x2="12" y2="3"/>
                    <line x1="12" y1="21" x2="12" y2="23"/>
                    <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
                    <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
                    <line x1="1" y1="12" x2="3" y2="12"/>
                    <line x1="21" y1="12" x2="23" y2="12"/>
                    <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
                    <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
                </svg>
                <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                </svg>
            </button>
        </div>
    </nav>

    <!-- Content -->
    <main class="tool-page">
        <div class="tool-container">
            <div class="content-card">
                <h1 class="tool-title">VIP视频解析</h1>

                <!-- 使用说明 -->
                <div class="tool-steps">
                    <p>使用方法</p>
                    <ol>
                        <li>打开 <a href="https://www.iqiyi.com" target="_blank" rel="noopener">爱奇艺</a> 或其他视频平台，找到想要观看的视频</li>
                        <li>复制浏览器地址栏中的视频链接（不要跳转到 App）</li>
                        <li>粘贴到下方输入框，点击「解析播放」</li>
                    </ol>
                </div>

                <!-- 输入 + 主按钮 -->
                <div class="tool-input-row">
                    <input
                        class="tool-input"
                        id="videoUrl"
                        type="text"
                        placeholder="粘贴视频链接，例如 https://www.iqiyi.com/v_xxxxx.html"
                    />
                    <button class="tool-btn tool-btn-primary" onclick="playVideo()">解析播放</button>
                </div>

                <!-- 辅助按钮 -->
                <div style="display:flex;gap:10px;margin-top:10px;">
                    <button class="tool-btn tool-btn-secondary" onclick="goOriginal()">打开原视频</button>
                    <button class="tool-btn tool-btn-secondary" onclick="toggleFullscreen()">全屏播放</button>
                </div>

                <!-- 播放区域 -->
                <div id="playerContainer" class="tool-player">
                    <iframe id="player" allowfullscreen></iframe>
                </div>

                <!-- 返回 -->
                <a href="index.html" class="tool-back">&larr; 返回主页</a>
            </div>
        </div>
    </main>

    <!-- Theme Toggle -->
    <script>
        (function() {
            var html = document.documentElement;
            var toggle = document.getElementById('themeToggle');

            function getTheme() {
                var saved = localStorage.getItem('theme');
                if (saved) return saved;
                return window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
            }

            function applyTheme(theme) {
                if (theme === 'light') {
                    html.setAttribute('data-theme', 'light');
                } else {
                    html.removeAttribute('data-theme');
                }
            }

            function setTheme(theme) {
                applyTheme(theme);
                localStorage.setItem('theme', theme);
            }

            applyTheme(getTheme());

            if (toggle) {
                toggle.addEventListener('click', function() {
                    var current = html.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
                    setTheme(current);
                });
            }

            window.matchMedia('(prefers-color-scheme: light)').addEventListener('change', function(e) {
                if (!localStorage.getItem('theme')) {
                    setTheme(e.matches ? 'light' : 'dark');
                }
            });
        })();

        // Nav scroll background
        var nav = document.getElementById('mainNav');
        window.addEventListener('scroll', function() {
            if (window.scrollY > 10) {
                nav.classList.add('scrolled');
            } else {
                nav.classList.remove('scrolled');
            }
        }, { passive: true });
    </script>

    <!-- Video Functions -->
    <script>
        function goOriginal() {
            var url = document.getElementById('videoUrl').value.trim();
            if (!url) { alert('请先输入视频链接！'); return; }
            window.open(url);
        }

        function playVideo() {
            var url = document.getElementById('videoUrl').value.trim();
            if (!url) { alert('请先输入视频链接！'); return; }
            var parseUrl = 'https://jx.xmflv.cc/?url=' + encodeURIComponent(url);
            document.getElementById('player').src = parseUrl;
        }

        function toggleFullscreen() {
            var container = document.getElementById('playerContainer');
            if (!document.fullscreenElement) {
                container.requestFullscreen().catch(function(err) {
                    alert('全屏请求失败: ' + err.message);
                });
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }
    </script>

</body>
</html>
