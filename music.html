<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>双人听歌</title>
<link rel="icon" type="image/x-icon" href="static/assets/favicon.ico">
<link type="text/css" href="static/css/main.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
.mu-page{min-height:100vh;padding:calc(var(--nav-height) + 20px) 24px 32px;}
.mu-grid{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:16px;max-width:1100px;margin:0 auto;height:calc(100vh - var(--nav-height) - 70px);min-height:580px;transition:all .45s cubic-bezier(.25,1,.5,1);}
.mu-grid.expanded .mu-widget:not(.active){opacity:.2;pointer-events:none;transform:scale(.94);filter:blur(1px);}
.mu-grid.expanded .mu-widget.active{grid-column:1 / -1;grid-row:1 / -1;z-index:10;}
.mu-grid.expanded{cursor:default;}

.mu-widget{background:var(--bg-card);border-radius:var(--radius-md);box-shadow:var(--shadow-card);display:flex;flex-direction:column;overflow:hidden;transition:all .45s cubic-bezier(.25,1,.5,1),opacity .35s ease;cursor:pointer;}
.mu-w-hdr{padding:10px 16px;font-size:11px;font-weight:600;color:var(--text-secondary);border-bottom:1px solid var(--border-light);display:flex;align-items:center;gap:7px;flex-shrink:0;text-transform:uppercase;letter-spacing:.05em;}
.mu-w-hdr .dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.mu-dot-green{background:#22c55e;}.mu-dot-amber{background:#f59e0b;}.mu-dot-blue{background:#3b82f6;}.mu-dot-purple{background:#8b5cf6;}
.mu-w-count{font-size:11px;color:var(--text-tertiary);margin-left:auto;}
.mu-w-retract{display:none;margin-left:8px;padding:3px 10px;border-radius:10px;border:1px solid var(--border);background:var(--bg-primary);color:var(--text-secondary);font-size:10px;cursor:pointer;text-transform:none;letter-spacing:0;font-weight:400;}
.mu-grid.expanded .mu-w-retract{display:inline-block;}
.mu-grid.expanded .mu-widget{cursor:default;}
.mu-grid:not(.expanded) .mu-widget:hover{box-shadow:var(--shadow-card-hover);transform:translateY(-1px);}

/* Chat */
.mu-chat-msgs{flex:1;overflow-y:auto;padding:10px 14px;display:flex;flex-direction:column;gap:5px;min-height:0;}
.mu-msg{max-width:88%;}
.mu-msg.me{align-self:flex-end;}.mu-msg.me .mu-bub{background:var(--accent);color:#fff;border-bottom-right-radius:4px;}
.mu-msg.you{align-self:flex-start;}.mu-msg.you .mu-bub{background:var(--bg-secondary);color:var(--text-primary);border-bottom-left-radius:4px;}
.mu-bub{padding:6px 12px;border-radius:14px;font-size:13px;line-height:1.45;word-break:break-word;display:inline-block;max-width:100%;}
.mu-msg-sender{font-size:10px;color:var(--text-tertiary);margin-bottom:1px;}
.mu-msg-time{font-size:9px;color:var(--text-tertiary);margin-top:2px;text-align:right;}
.mu-chat-row{display:flex;gap:6px;padding:10px 12px;border-top:1px solid var(--border-light);flex-shrink:0;}
.mu-chat-row input{flex:1;padding:8px 12px;border:1px solid var(--border);border-radius:18px;font-size:13px;font-family:var(--font-system);background:var(--bg-primary);color:var(--text-primary);outline:none;}
.mu-chat-row input:focus{border-color:var(--accent);}
.mu-chat-row button{padding:7px 16px;border-radius:18px;border:none;background:var(--accent);color:#fff;font-size:12px;font-weight:600;cursor:pointer;flex-shrink:0;}
.mu-chat-row button:hover{background:var(--accent-hover);}

/* Now Playing */
.mu-np-body{flex:1;display:flex;flex-direction:column;overflow:hidden;min-height:0;}
.mu-np-info{display:flex;align-items:center;gap:10px;padding:10px 14px;flex-shrink:0;}
.mu-np-art{font-size:28px;flex-shrink:0;}
.mu-np-title{font-size:15px;font-weight:600;color:var(--text-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.mu-np-artist{font-size:12px;color:var(--text-tertiary);margin-top:1px;}
.mu-np-ctrl{display:flex;align-items:center;gap:8px;padding:0 14px 6px;flex-shrink:0;}
.mu-np-ctrl button{background:none;border:none;font-size:18px;cursor:pointer;color:var(--text-primary);padding:3px 7px;border-radius:50%;}
.mu-np-ctrl button:hover{color:var(--accent);background:var(--bg-secondary);}
.mu-np-seek{display:flex;align-items:center;gap:8px;padding:0 14px 4px;flex-shrink:0;font-size:10px;color:var(--text-tertiary);}
.mu-np-seek input[type=range]{flex:1;accent-color:var(--accent);height:4px;cursor:pointer;}
.mu-np-lyr{flex:1;overflow-y:auto;padding:6px 14px 10px;text-align:center;font-size:12px;color:var(--text-tertiary);line-height:2.2;min-height:0;}
.mu-np-lyr .ln{opacity:.4;transition:opacity .25s,color .25s,font-size .25s;}
.mu-np-lyr .ln.act{opacity:1;color:var(--accent);font-weight:600;font-size:14px;}
.mu-np-empty{display:flex;align-items:center;justify-content:center;height:100%;color:var(--text-tertiary);font-size:14px;}

/* Playlist */
.mu-pl-list{flex:1;overflow-y:auto;padding:4px 0;min-height:0;}
.mu-pl-item{display:flex;align-items:center;gap:8px;padding:7px 14px;cursor:pointer;transition:background .12s;font-size:13px;}
.mu-pl-item:hover{background:var(--bg-secondary);}
.mu-pl-item.playing{background:rgba(26,86,219,.08);}
.mu-pl-item .num{width:18px;text-align:right;color:var(--text-tertiary);font-size:11px;flex-shrink:0;}
.mu-pl-item .info{flex:1;min-width:0;}
.mu-pl-item .ti{color:var(--text-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px;}
.mu-pl-item .ar{color:var(--text-tertiary);font-size:11px;margin-top:1px;}
.mu-pl-item .del{color:var(--text-tertiary);font-size:16px;cursor:pointer;padding:2px 4px;opacity:0;transition:opacity .15s;}
.mu-pl-item:hover .del{opacity:1;}.mu-pl-item .del:hover{color:#ef4444;}

/* Search */
.mu-search-body{flex:1;display:flex;flex-direction:column;overflow:hidden;min-height:0;}
.mu-s-box{padding:10px 12px;display:flex;gap:6px;flex-shrink:0;}
.mu-s-box input{flex:1;padding:8px 12px;border:1px solid var(--border);border-radius:8px;font-size:13px;font-family:var(--font-system);background:var(--bg-primary);color:var(--text-primary);outline:none;}
.mu-s-box input:focus{border-color:var(--accent);}
.mu-s-box button{padding:7px 14px;border-radius:8px;border:none;background:var(--accent);color:#fff;font-size:12px;font-weight:600;cursor:pointer;flex-shrink:0;}
.mu-s-box button:hover{background:var(--accent-hover);}
.mu-s-sources{display:flex;flex-wrap:wrap;gap:5px;padding:0 12px 8px;font-size:11px;flex-shrink:0;}
.mu-s-sources label{padding:3px 9px;border-radius:12px;border:1px solid var(--border);cursor:pointer;display:flex;align-items:center;gap:4px;font-size:10px;}
.mu-s-sources label input{accent-color:var(--accent);margin:0;}
.mu-s-results{flex:1;overflow-y:auto;padding:0 12px;min-height:0;}
.mu-s-item{display:flex;align-items:center;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--border-light);cursor:pointer;font-size:13px;}
.mu-s-item:hover{opacity:.8;}
.mu-s-item .ti{color:var(--text-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.mu-s-item .ar{color:var(--text-tertiary);font-size:11px;}
.mu-s-item .add{padding:3px 10px;border-radius:12px;border:1px solid var(--accent);background:transparent;color:var(--accent);font-size:11px;cursor:pointer;flex-shrink:0;margin-left:8px;transition:all .15s;}
.mu-s-item .add:hover{background:var(--accent);color:#fff;}
.mu-s-stats{padding:4px 12px;font-size:11px;color:var(--text-tertiary);flex-shrink:0;}
.mu-back{display:inline-block;margin-top:12px;color:var(--text-tertiary);font-size:13px;text-decoration:none;}
.mu-back:hover{color:var(--accent);}

@media(max-width:860px){
  .mu-grid{grid-template-columns:1fr;grid-template-rows:auto;height:auto;gap:10px;}
  .mu-widget{min-height:40vh;}
}
</style>
</head>
<body>

<nav class="nav" id="mainNav">
  <div class="nav-inner">
    <a class="nav-brand" href="index.html">Li Zhijiang</a>
    <div style="display:flex;align-items:center;gap:10px;">
      <span style="font-size:12px;color:var(--text-tertiary);" id="roomLbl"></span>
      <a href="index.html" style="font-size:12px;color:var(--text-tertiary);">← 主页</a>
      <button class="theme-toggle" id="themeToggle" aria-label="切换明暗">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
    </div>
  </div>
</nav>

<main class="mu-page">
  <div class="mu-grid">
    <!-- 1. Chat -->
    <div class="mu-widget" id="wChat">
      <div class="mu-w-hdr"><span class="dot mu-dot-green"></span> 房间聊天<span class="mu-w-count" id="roomName"></span><button class="mu-w-retract" data-retract>收起</button></div>
      <div class="mu-chat-msgs" id="chatMsgs"><div style="text-align:center;color:var(--text-tertiary);font-size:12px;padding:16px;">连接中…</div></div>
      <div class="mu-chat-row"><input id="chatInput" placeholder="说点什么…" maxlength="200"><button id="btnSend">发送</button></div>
    </div>

    <!-- 2. Now Playing -->
    <div class="mu-widget" id="wPlayer">
      <div class="mu-w-hdr"><span class="dot mu-dot-amber"></span> 正在播放<button class="mu-w-retract" data-retract>收起</button></div>
      <div class="mu-np-body">
        <div class="mu-np-info">
          <span class="mu-np-art" id="npArt">🎵</span>
          <div style="flex:1;min-width:0;"><div class="mu-np-title" id="npTitle">选择一首歌曲</div><div class="mu-np-artist" id="npArtist"></div></div>
        </div>
        <div class="mu-np-ctrl">
          <button id="btnPrev" title="上一首">⏮</button><button id="btnPlay" title="播放/暂停">▶</button><button id="btnNext" title="下一首">⏭</button>
          <button id="btnFav" title="收藏" style="font-size:14px;">🤍</button>
          <span style="flex:1;"></span>
          <span style="font-size:10px;color:var(--text-tertiary);">🔊</span>
          <input type="range" id="volSld" min="0" max="1" step="0.01" value="0.8" style="width:70px;accent-color:var(--accent);">
        </div>
        <div class="mu-np-seek">
          <span id="curTime">00:00</span>
          <input type="range" id="seekBar" min="0" max="100" value="0" step="0.1">
          <span id="durTime">00:00</span>
        </div>
        <div class="mu-np-lyr" id="lyrBox"><div class="mu-np-empty">暂无歌词</div></div>
      </div>
    </div>

    <!-- 3. Playlist -->
    <div class="mu-widget" id="wPlaylist">
      <div class="mu-w-hdr"><span class="dot mu-dot-blue"></span> 共享歌单<span class="mu-w-count" id="plCount">0 首</span><button class="mu-w-retract" data-retract>收起</button></div>
      <div class="mu-pl-list" id="plList"><div style="text-align:center;color:var(--text-tertiary);font-size:12px;padding:20px;">从搜索区添加歌曲</div></div>
      <div style="padding:8px 14px;border-top:1px solid var(--border-light);font-size:11px;color:var(--text-tertiary);flex-shrink:0;">
        顺序播放 · 点击歌曲切换 · 悬停显示删除
      </div>
    </div>

    <!-- 4. Search -->
    <div class="mu-widget" id="wSearch">
      <div class="mu-w-hdr"><span class="dot mu-dot-purple"></span> 搜索歌曲<button class="mu-w-retract" data-retract>收起</button></div>
      <div class="mu-search-body">
        <div class="mu-s-box">
          <input id="sInp" placeholder="输入歌名或歌手…">
          <button id="sBtn">搜索</button>
        </div>
        <div class="mu-s-sources">
          <label><input type="checkbox" data-src="migu" checked>咪咕</label>
          <label><input type="checkbox" data-src="netease" checked>网易云</label>
          <label><input type="checkbox" data-src="qq" checked>QQ</label>
          <label><input type="checkbox" data-src="kuwo" checked>酷我</label>
        </div>
        <div class="mu-s-stats" id="sStat">搜索你想听的歌</div>
        <div class="mu-s-results" id="resList"></div>
      </div>
    </div>
  </div>

  <audio id="audio" preload="metadata"></audio>
  <a href="index.html" class="mu-back">← 返回主页</a>
</main>

<script>
(function(){
// ===== Config =====
var SB={url:'https://qudyifwqcdququqndomb.supabase.co',key:'sb_publishable_vn5kUwJrK0rMLqkUtjAmHA_YPOWlHm-'};
var sb=supabase.createClient(SB.url,SB.key);

var p=new URLSearchParams(location.search),room=p.get('room')||'default';
var sender=localStorage.getItem('mu_nick')||('听友'+Math.floor(Math.random()*900+100));
localStorage.setItem('mu_nick',sender);
q('roomName').textContent=sender+' @ '+room;

// ===== State =====
var St={
  pl:[],curIdx:-1,lyr:[],lyrIdx:-1,
  srcs:{migu:true,netease:true,qq:true,kuwo:true},
  results:[],tMap:new Map(),
};
var audio=q('audio');audio.volume=0.8;

// ===== Utilities =====
function $(id){return document.getElementById(id);}
function q(s){return document.querySelector(s);};
function fmt(t){if(!isFinite(t)||t<0)return'00:00';var m=Math.floor(t/60),s=Math.floor(t%60);return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');}
function toast(m){var t=document.createElement('div');t.style.cssText='position:fixed;bottom:24px;left:50%;transform:translateX(-50%);padding:8px 18px;border-radius:20px;background:rgba(0,0,0,.85);color:#fff;font-size:12px;z-index:9999;pointer-events:none;';t.textContent=m;document.body.appendChild(t);setTimeout(function(){t.remove();},2000);}
function qTag(u){if(!u)return'';var e=u.split('?')[0].toLowerCase().match(/\.([a-z0-9]+)$/);return e&&['flac','wav','ape','alac'].includes(e[1])?'LOSSLESS':'';}

// ===== Chat =====
var cm=q('#chatMsgs'),mc=0;
function addMsg(who,txt,tm,isMe){
  var all=cm.querySelectorAll('.mu-msg'),last=all[all.length-1];
  if(last){var lb=last.querySelector('.mu-bub');if(lb&&lb.textContent===txt&&mc>0)return;}
  mc++;var d=document.createElement('div');d.className='mu-msg '+(isMe?'me':'you');
  var tt=tm?new Date(tm).toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'}):'';
  d.innerHTML='<div class="mu-msg-sender">'+who+'</div><div class="mu-bub">'+txt+'</div><div class="mu-msg-time">'+tt+'</div>';
  cm.appendChild(d);cm.scrollTop=cm.scrollHeight;
}
q('#btnSend').addEventListener('click',function(){var v=q('#chatInput').value.trim();if(!v)return;q('#chatInput').value='';sb.from('messages').insert({room_id:room,sender:sender,content:v}).then();});
q('#chatInput').addEventListener('keydown',function(e){if(e.key==='Enter')q('#btnSend').click();});

sb.channel('mu-'+room+'-chat').on('postgres_changes',{event:'INSERT',schema:'public',table:'messages',filter:'room_id=eq.'+room},function(p){var m=p.new;addMsg(m.sender,m.content,m.created_at,m.sender===sender);}).subscribe();
sb.from('messages').select('*').eq('room_id',room).order('created_at',{ascending:true}).limit(50).then(function(r){if(r.data)r.data.forEach(function(m){addMsg(m.sender,m.content,m.created_at,m.sender===sender);});});

// ===== Playlist (Supabase realtime) =====
function playlistChanged(){renderPL();}
sb.channel('mu-'+room+'-pl').on('postgres_changes',{event:'INSERT',schema:'public',table:'playlist',filter:'room_id=eq.'+room},function(p){St.pl.push(p.new);playlistChanged();})
.on('postgres_changes',{event:'DELETE',schema:'public',table:'playlist',filter:'room_id=eq.'+room},function(p){St.pl=St.pl.filter(function(x){return x.id!==p.old.id;});playlistChanged();}).subscribe();

function loadPL(){
  sb.from('playlist').select('*').eq('room_id',room).order('created_at',{ascending:true}).then(function(r){
    if(r.data){St.pl=r.data;renderPL();}
  });
}
function addToPL(song){
  sb.from('playlist').insert({room_id:room,song_id:song.id,song_name:song.name,artist:song.artist,song_url:'',copyright_id:song.cid||'',album_id:song.aid||'0'}).then();
}
function delFromPL(id){sb.from('playlist').delete().eq('id',id).then();}
function renderPL(){
  var w=q('#plList'),c=q('#plCount');c.textContent=St.pl.length+' 首';
  if(!St.pl.length){w.innerHTML='<div style="text-align:center;color:var(--text-tertiary);font-size:12px;padding:20px;">从搜索区添加歌曲</div>';return;}
  w.innerHTML='';
  St.pl.forEach(function(s,i){
    var d=document.createElement('div');d.className='mu-pl-item'+(i===St.curIdx?' playing':'');
    d.innerHTML='<span class="num">'+(i===St.curIdx?'▶':i+1)+'</span><div class="info"><div class="ti">'+s.song_name+'</div><div class="ar">'+s.artist+'</div></div><span class="del" data-id="'+s.id+'">×</span>';
    d.addEventListener('click',function(e){if(e.target.classList.contains('del'))return;plPlay(i);});
    w.appendChild(d);
  });
  w.querySelectorAll('.del').forEach(function(b){b.addEventListener('click',function(e){e.stopPropagation();delFromPL(parseInt(this.dataset.id));});});
}

// ===== Play from playlist =====
function plPlay(i){
  if(i<0||i>=St.pl.length)return;St.curIdx=i;renderPL();
  var s=St.pl[i];q('#npTitle').textContent=s.song_name;q('#npArtist').textContent=s.artist;q('#btnPlay').textContent='⏸';
  playDetail(s);
}
function plNext(dir){
  if(!St.pl.length)return;var i=St.curIdx;if(i<0)i=0;
  i=(i+(dir==='prev'?-1:1)+St.pl.length)%St.pl.length;plPlay(i);
}
async function playDetail(s){
  try{await ensureDetail(s);q('#npTitle').textContent=s.song_name;q('#npArtist').textContent=s.artist;
    St.lyr=s.lrc?parseLRC(s.lrc):[];renderLyrics();if(s.audioUrl){audio.src=s.audioUrl;audio.play().catch(function(){});}
  }catch(e){console.error(e);}
}

// ===== Detail APIs =====
async function ensureDetail(t){
  if(t.__loaded&&t.audioUrl)return;
  var src=t.source||(t.song_id&&t.song_id.indexOf('migu')>-1?'migu':t.song_id&&t.song_id.indexOf('ne-')===0?'netease':t.song_id&&t.song_id.indexOf('qq-')===0?'qq':t.song_id&&t.song_id.indexOf('kw-')===0?'kuwo':'migu');
  try{
    if(src==='migu'||src==='migu'){
      var u='https://api.xcvts.cn/api/music/migu?gm='+encodeURIComponent(t.song_name)+'&n=1&num=1&type=json';
      var r=await fetch(u),j=await r.json();
      if(j.data&&j.data.length){var d=j.data[0];t.audioUrl=d.music_url||'';t.lrcUrl=d.lrc_url||'';t.__loaded=true;}else{t.audioUrl='';t.__loaded=true;}
    }else if(src==='netease'){
      var mu='https://api.qijieya.cn/meting/?type=song&id='+t.song_id.split('-')[1];
      var mr=await fetch(mu),mj=await mr.json();
      if(Array.isArray(mj)&&mj.length){t.audioUrl=mj[0].url||'';t.__loaded=true;}
      try{var lr=await fetch('https://api.vkeys.cn/v2/music/netease/lyric?id='+t.song_id.split('-')[1]);var lj=await lr.json();if(lj&&lj.code===200&&lj.data)t.lrc=lj.data.lrc||'';}catch(e){}
    }else if(src==='qq'){
      var qu='https://tang.api.s01s.cn/music_open_api.php?msg='+encodeURIComponent(t.song_name+' '+t.artist)+'&type=json&mid='+(t.copyright_id||t.song_id);
      var qr=await fetch(qu),qj=await qr.json();
      if(qj&&qj.song_mid){t.audioUrl=qj.song_play_url_sq||qj.song_play_url_hq||qj.song_play_url||'';t.lrc=qj.song_lyric||'';t.__loaded=true;}
    }else if(src==='kuwo'){
      var ku='https://kw-api.cenguigui.cn/?id='+t.song_id+'&type=song&level=zp&format=json';
      var kr=await fetch(ku),kj=await kr.json();
      if(kj&&kj.code===200&&kj.data){t.audioUrl=kj.data.url||'';t.lrc=kj.data.lyric||'';t.__loaded=true;}
    }
  }catch(e){console.error(e);t.__loaded=true;}
}

// ===== Lyrics =====
function parseLRC(txt){
  if(!txt)return[];var lines=txt.split(/\r?\n/),rg=/\[(\d{1,2}):(\d{1,2})(?:\.(\d{1,3}))?\]/,out=[];
  lines.forEach(function(ln){var m=rg.exec(ln);if(!m)return;var t=parseInt(m[1])*60+parseInt(m[2])+(m[3]?parseInt(m[3].padEnd(3,'0'))/1000:0),tx=ln.replace(rg,'').trim();if(tx)out.push({time:t,text:tx});});
  return out.sort(function(a,b){return a.time-b.time;});
}
function renderLyrics(){
  var b=q('#lyrBox');b.innerHTML='';St.lyrIdx=-1;
  if(!St.lyr.length){b.innerHTML='<div class="mu-np-empty">暂无歌词</div>';return;}
  St.lyr.forEach(function(ln,i){var d=document.createElement('div');d.className='ln';d.dataset.idx=i;d.textContent=ln.text;b.appendChild(d);});
}
function updLyr(tm){
  if(!St.lyr.length)return;var i=St.lyrIdx;
  if(i<0||tm<St.lyr[i].time||(i+1<St.lyr.length&&tm>=St.lyr[i+1].time))
    i=St.lyr.findIndex(function(l,j){var n=St.lyr[j+1];return n?tm>=l.time-.05&&tm<n.time-.05:tm>=l.time-.05;});
  if(i>=0&&i!==St.lyrIdx){St.lyrIdx=i;q('#lyrBox').querySelectorAll('.ln.act').forEach(function(el){el.classList.remove('act');});var a=q('#lyrBox').querySelector('.ln[data-idx="'+i+'"]');if(a){a.classList.add('act');a.scrollIntoView({block:'center',behavior:'smooth'});}}
}

// ===== Search =====
async function searchAll(){
  var kw=q('#sInp').value.trim();if(!kw)return;q('#sStat').textContent='搜索中…';
  St.results=[];St.tMap.clear();var ts=[];
  if(St.srcs.migu)ts.push(sMigu(kw));
  if(St.srcs.netease)ts.push(sNetease(kw));
  if(St.srcs.qq)ts.push(sQQ(kw));
  if(St.srcs.kuwo)ts.push(sKuwo(kw));
  await Promise.all(ts);q('#sStat').textContent='共 '+St.results.length+' 首';renderSearch();
}
async function sMigu(kw){
  var u='https://api.xcvts.cn/api/music/migu?gm='+encodeURIComponent(kw)+'&n=&num=10&type=json';
  try{var r=await fetch(u),j=await r.json();if(j.code!==200||!Array.isArray(j.data))return;
  j.data.forEach(function(it){var uid='migu-'+it.n+'-'+it.title;if(St.tMap.has(uid))return;var t={id:uid,name:it.title||'',artist:it.singer||'',source:'migu',cid:it.copyrightId||''};St.tMap.set(uid,t);St.results.push(t);});}catch(e){}
}
async function sNetease(kw){
  var u='https://api.vkeys.cn/v2/music/netease?word='+encodeURIComponent(kw)+'&page=1&num=10';
  try{var r=await fetch(u),j=await r.json();if(j.code!==200||!Array.isArray(j.data))return;
  j.data.forEach(function(it){var uid='ne-'+it.id;if(St.tMap.has(uid))return;var t={id:uid,name:it.song||'',artist:it.singer||'',source:'netease'};St.tMap.set(uid,t);St.results.push(t);});}catch(e){}
}
async function sQQ(kw){
  var u='https://tang.api.s01s.cn/music_open_api.php?msg='+encodeURIComponent(kw)+'&type=json';
  try{var r=await fetch(u),j=await r.json(),d=Array.isArray(j)?j:(Array.isArray(j&&j.data)?j.data:[]);if(!d.length)return;
  d.slice(0,10).forEach(function(it){var uid='qq-'+it.song_mid;if(St.tMap.has(uid))return;var t={id:uid,name:it.song_title||'',artist:it.singer_name||'',source:'qq',cid:it.song_mid};St.tMap.set(uid,t);St.results.push(t);});}catch(e){}
}
async function sKuwo(kw){
  var u='https://kw-api.cenguigui.cn/?name='+encodeURIComponent(kw)+'&page=1&limit=10';
  try{var r=await fetch(u),j=await r.json();if(j.code!==200||!Array.isArray(j.data))return;
  j.data.forEach(function(it){var uid='kw-'+it.rid;if(St.tMap.has(uid))return;var t={id:uid,name:it.name||'',artist:it.artist||'',source:'kuwo'};St.tMap.set(uid,t);St.results.push(t);});}catch(e){}
}
function renderSearch(){
  var w=q('#resList');w.innerHTML='';
  St.results.forEach(function(t){
    var d=document.createElement('div');d.className='mu-s-item';
    d.innerHTML='<div style="min-width:0;flex:1;"><div class="ti">'+t.name+'</div><div class="ar">'+t.artist+' · '+t.source+'</div></div><button class="add">+ 添加</button>';
    d.querySelector('.add').addEventListener('click',function(e){e.stopPropagation();addToPL(t);this.textContent='✓';this.style.background='#22c55e';this.style.color='#fff';this.style.borderColor='#22c55e';setTimeout(function(){this.textContent='+ 添加';this.style.background='';this.style.color='';this.style.borderColor='';}.bind(this),2000);}.bind(d.querySelector('.add')));
    w.appendChild(d);
  });
}

// ===== Events =====
q('#sBtn').addEventListener('click',searchAll);
q('#sInp').addEventListener('keydown',function(e){if(e.key==='Enter')searchAll();});
document.querySelectorAll('.mu-s-sources input').forEach(function(cb){cb.addEventListener('change',function(){St.srcs[cb.dataset.src]=cb.checked;});});

q('#btnPlay').addEventListener('click',function(){if(!audio.src)return;if(audio.paused){audio.play();}else{audio.pause();}});
q('#btnPrev').addEventListener('click',function(){plNext('prev');});
q('#btnNext').addEventListener('click',function(){plNext('next');});
q('#btnFav').addEventListener('click',function(){var t=St.pl[St.curIdx];if(!t)return;var e=q('#btnFav');e.textContent=e.textContent==='🤍'?'❤️':'🤍';});

audio.addEventListener('play',function(){q('#btnPlay').textContent='⏸';});
audio.addEventListener('pause',function(){q('#btnPlay').textContent='▶';});
audio.addEventListener('timeupdate',function(){
  var c=audio.currentTime||0,d=audio.duration||0;q('#curTime').textContent=fmt(c);q('#durTime').textContent=fmt(d||0);
  var sb=q('#seekBar');sb.max=d||100;sb.value=c;updLyr(c);
});
audio.addEventListener('ended',function(){plNext('next');});

q('#seekBar').addEventListener('input',function(){var d=audio.duration||0;audio.currentTime=parseFloat(this.value)*(d/parseFloat(this.max||100));});
q('#volSld').addEventListener('input',function(){audio.volume=parseFloat(this.value);});

// Keyboard
document.addEventListener('keydown',function(e){var tg=document.activeElement.tagName.toLowerCase();if(tg==='input'||tg==='textarea')return;
  if(e.code==='Space'){e.preventDefault();if(!audio.src)return;audio.paused?audio.play():audio.pause();}
  if(e.key==='ArrowRight')audio.currentTime=(audio.currentTime||0)+5;
  if(e.key==='ArrowLeft')audio.currentTime=Math.max(0,(audio.currentTime||0)-5);
  if(e.key==='ArrowUp'){audio.volume=Math.min(1,(audio.volume||0)+.05);q('#volSld').value=audio.volume;}
  if(e.key==='ArrowDown'){audio.volume=Math.max(0,(audio.volume||0)-.05);q('#volSld').value=audio.volume;}
  if(e.key==='n'||e.key==='N')plNext('next');
  if(e.key==='p'||e.key==='P')plNext('prev');
});

// Theme
(function(){var h=document.documentElement,tg=q('#themeToggle');function gt(){var s=localStorage.getItem('theme');return s||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');}function ap(t){if(t==='light')h.setAttribute('data-theme','light');else h.removeAttribute('data-theme');}ap(gt());if(tg)tg.addEventListener('click',function(){var n=h.getAttribute('data-theme')==='light'?'dark':'light';ap(n);localStorage.setItem('theme',n);});addEventListener('scroll',function(){q('#mainNav').classList.toggle('scrolled',scrollY>10);},{passive:true});})();

// Widget expand / retract
var grid=q('.mu-grid'),expanded=null;

function expandWidget(w) {
  grid.classList.add('expanded');
  w.classList.add('active');expanded=w;
}
function retractAll(){
  grid.classList.remove('expanded');
  if(expanded){expanded.classList.remove('active');expanded=null;}
}
document.querySelectorAll('.mu-widget').forEach(function(w){
  w.addEventListener('click',function(e){
    if(e.target.closest('[data-retract]')){retractAll();return;}
    if(e.target.closest('button')||e.target.closest('input')||e.target.closest('.mu-s-item')||e.target.closest('.mu-pl-item')||e.target.closest('.del'))return;
    if(expanded&&expanded!==w){retractAll();}
    if(expanded===w){retractAll();}else{expandWidget(w);}
  });
});
document.addEventListener('keydown',function(e){if(e.key==='Escape')retractAll();});

// Init
loadPL();
sb.from('messages').select('*').eq('room_id',room).order('created_at',{ascending:true}).limit(50).then(function(r){if(r.data)r.data.forEach(function(m){addMsg(m.sender,m.content,m.created_at,m.sender===sender);});});
})();
