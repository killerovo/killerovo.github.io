<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>双人听歌</title>
<link rel="icon" type="image/x-icon" href="static/assets/favicon.ico" />
<link type="text/css" href="static/css/main.css" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
    .music-page {
        min-height: 100vh;
        padding: calc(var(--nav-height) + 24px) 24px 48px;
    }
    .music-layout {
        display: flex;
        gap: 24px;
        max-width: 1100px;
        margin: 0 auto;
        height: calc(100vh - var(--nav-height) - 96px);
        min-height: 560px;
    }
    .music-panel {
        background: var(--bg-card);
        border-radius: var(--radius-md);
        box-shadow: var(--shadow-card);
        display: flex;
        flex-direction: column;
        overflow: hidden;
    }
    .music-chat-panel { flex: 1; min-width: 0; }
    .music-side-panel { width: 380px; flex-shrink: 0; }

    .panel-header {
        padding: 14px 20px;
        font-size: 13px;
        font-weight: 600;
        color: var(--text-primary);
        border-bottom: 1px solid var(--border-light);
        display: flex;
        align-items: center;
        gap: 8px;
        flex-shrink: 0;
    }
    .panel-header .dot { width: 8px; height: 8px; border-radius: 50%; }
    .dot-online { background: #22c55e; }

    /* Chat */
    .music-chat-msgs {
        flex: 1;
        overflow-y: auto;
        padding: 16px 20px;
        display: flex;
        flex-direction: column;
        gap: 8px;
    }
    .chat-msg {
        display: flex;
        flex-direction: column;
        max-width: 85%;
    }
    .chat-msg.me { align-self: flex-end; }
    .chat-msg.other { align-self: flex-start; }
    .chat-msg .sender {
        font-size: 11px;
        color: var(--text-tertiary);
        margin-bottom: 2px;
    }
    .chat-msg .bubble {
        padding: 8px 14px;
        border-radius: 16px;
        font-size: 14px;
        line-height: 1.5;
        word-break: break-word;
    }
    .chat-msg.me .bubble {
        background: var(--accent);
        color: #fff;
        border-bottom-right-radius: 4px;
    }
    .chat-msg.other .bubble {
        background: var(--bg-secondary);
        color: var(--text-primary);
        border-bottom-left-radius: 4px;
    }
    .chat-msg .time {
        font-size: 10px;
        color: var(--text-tertiary);
        margin-top: 2px;
    }
    .chat-input-row {
        display: flex;
        gap: 8px;
        padding: 12px 16px;
        border-top: 1px solid var(--border-light);
    }
    .chat-input-row input {
        flex: 1;
        padding: 10px 14px;
        border: 1px solid var(--border);
        border-radius: 20px;
        font-size: 14px;
        font-family: var(--font-system);
        background: var(--bg-primary);
        color: var(--text-primary);
        outline: none;
    }
    .chat-input-row input:focus { border-color: var(--accent); }
    .chat-send {
        padding: 10px 20px;
        border-radius: 20px;
        border: none;
        background: var(--accent);
        color: #fff;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        transition: background var(--ease-out);
        flex-shrink: 0;
    }
    .chat-send:hover { background: var(--accent-hover); }

    /* Side panel */
    .music-search-box {
        padding: 14px 16px 0;
    }
    .music-search-box input {
        width: 100%;
        padding: 10px 14px;
        border: 1px solid var(--border);
        border-radius: 8px;
        font-size: 14px;
        font-family: var(--font-system);
        background: var(--bg-primary);
        color: var(--text-primary);
        outline: none;
    }
    .music-search-box input:focus { border-color: var(--accent); }

    .music-search-results {
        max-height: 200px;
        overflow-y: auto;
        padding: 0 16px;
    }
    .search-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px 0;
        border-bottom: 1px solid var(--border-light);
    }
    .search-item .info { min-width: 0; flex: 1; }
    .search-item .name {
        font-size: 14px;
        font-weight: 500;
        color: var(--text-primary);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }
    .search-item .artist {
        font-size: 12px;
        color: var(--text-tertiary);
        margin-top: 2px;
    }
    .search-item .add-btn {
        padding: 5px 12px;
        border-radius: 6px;
        border: 1px solid var(--accent);
        background: transparent;
        color: var(--accent);
        font-size: 12px;
        font-weight: 500;
        cursor: pointer;
        transition: all var(--ease-out);
        flex-shrink: 0;
        margin-left: 12px;
    }
    .search-item .add-btn:hover { background: var(--accent); color: #fff; }
    .search-empty {
        padding: 24px 0;
        text-align: center;
        font-size: 13px;
        color: var(--text-tertiary);
    }
    .search-loading {
        padding: 24px 0;
        text-align: center;
        font-size: 13px;
        color: var(--text-tertiary);
    }

    /* Playlist */
    .music-playlist {
        flex: 1;
        overflow-y: auto;
        padding: 0 16px;
    }
    .playlist-item {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 0;
        border-bottom: 1px solid var(--border-light);
        cursor: pointer;
    }
    .playlist-item:hover { opacity: 0.8; }
    .playlist-item.playing .name { color: var(--accent); font-weight: 600; }
    .playlist-item .idx {
        font-size: 13px;
        color: var(--text-tertiary);
        width: 20px;
        text-align: center;
        flex-shrink: 0;
    }
    .playlist-item .info { min-width: 0; flex: 1; }
    .playlist-item .name {
        font-size: 14px;
        color: var(--text-primary);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }
    .playlist-item .artist {
        font-size: 12px;
        color: var(--text-tertiary);
    }
    .playlist-item .del-btn {
        background: none;
        border: none;
        color: var(--text-tertiary);
        cursor: pointer;
        font-size: 16px;
        padding: 4px;
        flex-shrink: 0;
        opacity: 0;
        transition: opacity var(--ease-out);
    }
    .playlist-item:hover .del-btn { opacity: 1; }
    .playlist-item .del-btn:hover { color: #ef4444; }
    .playlist-empty {
        padding: 32px 0;
        text-align: center;
        font-size: 13px;
        color: var(--text-tertiary);
    }

    /* Player */
    .music-player-bar {
        padding: 14px 16px;
        border-top: 1px solid var(--border-light);
        background: var(--bg-secondary);
        flex-shrink: 0;
    }
    .player-info {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 8px;
    }
    .player-info .title {
        font-size: 14px;
        font-weight: 600;
        color: var(--text-primary);
    }
    .player-info .artist { font-size: 12px; color: var(--text-tertiary); }
    .player-controls {
        display: flex;
        align-items: center;
        gap: 10px;
    }
    .player-controls button {
        background: none;
        border: none;
        font-size: 20px;
        cursor: pointer;
        color: var(--text-primary);
        padding: 2px 6px;
    }
    .player-controls button:hover { color: var(--accent); }
    .player-time {
        font-size: 11px;
        color: var(--text-tertiary);
        min-width: 60px;
        text-align: right;
    }
    .music-back {
        display: inline-block;
        margin-top: 20px;
        color: var(--text-tertiary);
        font-size: 14px;
        text-decoration: none;
    }
    .music-back:hover { color: var(--accent); }

    @media (max-width: 768px) {
        .music-layout { flex-direction: column; height: auto; }
        .music-side-panel { width: 100%; max-height: 50vh; }
        .music-chat-panel { min-height: 40vh; }
        .music-search-results { max-height: 150px; }
    }
</style>
</head>
<body>

<nav class="nav" id="mainNav">
    <div class="nav-inner">
        <a class="nav-brand" href="index.html">Li Zhijiang</a>
        <div style="display:flex;align-items:center;gap:12px;">
            <a href="index.html" style="font-size:13px;color:var(--text-tertiary);">← 返回主页</a>
            <button class="theme-toggle" id="themeToggle" aria-label="切换明暗主题">
                <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
                </svg>
                <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                </svg>
            </button>
        </div>
    </div>
</nav>

<main class="music-page">
    <div class="music-layout">
        <!-- Chat Panel -->
        <div class="music-panel music-chat-panel">
            <div class="panel-header"><span class="dot dot-online"></span> 房间聊天 · <span id="roomLabel" style="color:var(--text-tertiary);">---</span></div>
            <div class="music-chat-msgs" id="chatMsgs">
                <div style="text-align:center;color:var(--text-tertiary);font-size:13px;padding:20px;">欢迎来到听歌房间 🎵<br>在这里可以边听歌边聊天</div>
            </div>
            <div class="chat-input-row">
                <input id="chatInput" placeholder="说点什么..." maxlength="200" />
                <button class="chat-send" id="btnSend">发送</button>
            </div>
        </div>

        <!-- Side Panel -->
        <div class="music-panel music-side-panel">
            <div class="panel-header" style="border-bottom:none;padding-bottom:0;">🔍 搜索歌曲</div>
            <div class="music-search-box">
                <input id="searchInput" placeholder="搜歌名或歌手，回车搜索..." />
            </div>
            <div class="music-search-results" id="searchResults">
                <div class="search-empty">输入关键词搜索歌曲</div>
            </div>
            <div class="panel-header" style="border-bottom:none;padding-top:4px;">🎵 共享歌单 (<span id="playlistCount">0</span>)</div>
            <div class="music-playlist" id="playlist">
                <div class="playlist-empty">搜索歌曲后添加到歌单</div>
            </div>
            <div class="music-player-bar">
                <div class="player-info">
                    <span class="title" id="playerTitle">未选择歌曲</span>
                    <span class="artist" id="playerArtist"></span>
                </div>
                <div class="player-controls">
                    <button id="btnPrev" title="上一首">⏮</button>
                    <button id="btnPlay" title="播放/暂停">▶️</button>
                    <button id="btnNext" title="下一首">⏭</button>
                    <span style="flex:1;"></span>
                    <span class="player-time" id="playerTime">--:--</span>
                </div>
            </div>
        </div>
    </div>
    <a href="index.html" class="music-back">← 返回主页</a>
</main>

<script>
(function() {

// ---- Config ----
var SUPABASE_URL = 'https://qudyifwqcdququqndomb.supabase.co';
var SUPABASE_KEY = 'sb_publishable_vn5kUwJrK0rMLqkUtjAmHA_YPOWlHm-';
var EDGE_FN = SUPABASE_URL + '/functions/v1/music-proxy';

var sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// ---- Room / State ----
var params = new URLSearchParams(window.location.search);
var room = params.get('room') || 'default';
var sender = localStorage.getItem('music_nick') || ('听众' + Math.floor(Math.random() * 900 + 100));
if (!localStorage.getItem('music_nick')) localStorage.setItem('music_nick', sender);

document.getElementById('roomLabel').textContent = sender + ' @ ' + room;

var playlist = [];          // local copy
var currentIdx = -1;
var audio = new Audio();
audio.volume = 0.7;

// ---- Supabase Realtime ----
// Chat subscription
var chatChannel = sb.channel('room-' + room + '-chat');
chatChannel.on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages', filter: 'room_id=eq.' + room }, function(payload) {
    var msg = payload.new;
    addChatBubble(msg.sender, msg.content, msg.created_at || '', msg.sender === sender);
}).subscribe();

// Playlist subscription
var listChannel = sb.channel('room-' + room + '-playlist');
listChannel.on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'playlist', filter: 'room_id=eq.' + room }, function(payload) {
    var s = payload.new;
    playlist.push(s);
    renderPlaylist();
}).on('postgres_changes', { event: 'DELETE', schema: 'public', table: 'playlist', filter: 'room_id=eq.' + room }, function(payload) {
    var deleted = payload.old;
    playlist = playlist.filter(function(p) { return p.id !== deleted.id; });
    if (currentIdx >= playlist.length) currentIdx = playlist.length - 1;
    renderPlaylist();
}).subscribe();

// ---- Load existing data ----
function loadRoom() {
    // Load messages
    sb.from('messages').select('*').eq('room_id', room).order('created_at', { ascending: true }).limit(50)
        .then(function(res) {
            if (res.data) {
                res.data.forEach(function(m) {
                    addChatBubble(m.sender, m.content, m.created_at || '', m.sender === sender);
                });
            }
        });

    // Load playlist
    sb.from('playlist').select('*').eq('room_id', room).order('created_at', { ascending: true })
        .then(function(res) {
            if (res.data) {
                playlist = res.data;
                renderPlaylist();
            }
        });
}

// ---- Chat ----
var chatMsgs = document.getElementById('chatMsgs');
var msgCount = 0;

function addChatBubble(who, text, time, isMe) {
    // Deduplicate
    var existing = chatMsgs.querySelectorAll('.chat-msg');
    var last = existing[existing.length - 1];
    if (last && last.querySelector('.bubble') && last.querySelector('.bubble').textContent === text && msgCount > 0) return;
    msgCount++;

    var div = document.createElement('div');
    div.className = 'chat-msg ' + (isMe ? 'me' : 'other');
    var t = time ? new Date(time).toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' }) : '';
    div.innerHTML = '<div class="sender">' + who + '</div><div class="bubble">' + text + '</div><div class="time">' + t + '</div>';
    chatMsgs.appendChild(div);
    chatMsgs.scrollTop = chatMsgs.scrollHeight;
}

document.getElementById('btnSend').addEventListener('click', sendMsg);
document.getElementById('chatInput').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') sendMsg();
});

function sendMsg() {
    var input = document.getElementById('chatInput');
    var text = input.value.trim();
    if (!text) return;
    input.value = '';
    sb.from('messages').insert({ room_id: room, sender: sender, content: text }).then();
}

// ---- Music Search ----
var searchTimer = null;
document.getElementById('searchInput').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') {
        clearTimeout(searchTimer);
        doSearch(this.value.trim());
    }
});
document.getElementById('searchInput').addEventListener('input', function() {
    clearTimeout(searchTimer);
    var v = this.value.trim();
    if (v.length < 2) return;
    searchTimer = setTimeout(function() { doSearch(v); }, 400);
});

function doSearch(keyword) {
    if (!keyword) return;
    var container = document.getElementById('searchResults');
    container.innerHTML = '<div class="search-loading">搜索中...</div>';

    fetch(EDGE_FN + '?action=search&keyword=' + encodeURIComponent(keyword))
        .then(function(r) { return r.json(); })
        .then(function(data) {
            var songs = data.songs || [];
            if (!songs.length) {
                container.innerHTML = '<div class="search-empty">没有找到匹配歌曲</div>';
                return;
            }
            container.innerHTML = '';
            songs.slice(0, 12).forEach(function(s) {
                var div = document.createElement('div');
                div.className = 'search-item';
                div.innerHTML = '<div class="info"><div class="name">' + s.name + '</div><div class="artist">' + s.artist + '</div></div><button class="add-btn">+ 添加</button>';
                div.querySelector('.add-btn').addEventListener('click', function() {
                    addToPlaylist(s, this);
                });
                container.appendChild(div);
            });
        })
        .catch(function(err) {
            console.error(err);
            container.innerHTML = '<div class="search-empty">搜索失败，请稍后重试</div>';
        });
}

function addToPlaylist(song, btn) {
    if (btn) { btn.textContent = '...'; btn.disabled = true; }

    // Get real playable URL from Migu
    fetch(EDGE_FN + '?action=play&copyrightId=' + song.copyrightId + '&contentId=' + song.id + '&albumId=' + (song.albumId || '0'))
        .then(function(r) { return r.json(); })
        .then(function(data) {
            var realUrl = data.url || '';
            return sb.from('playlist').insert({
                room_id: room,
                song_id: String(song.id),
                song_name: song.name,
                artist: song.artist,
                song_url: realUrl,
                copyright_id: String(song.copyrightId || ''),
                album_id: String(song.albumId || '0')
            }).then(function(res) {
                if (res.error) throw res.error;
                if (btn) { btn.textContent = '✓'; btn.style.background = '#22c55e'; btn.style.color = '#fff'; btn.style.borderColor = '#22c55e'; }
            });
        })
        .catch(function(err) {
            console.error(err);
            if (btn) { btn.textContent = '失败'; btn.style.background = '#ef4444'; btn.style.color = '#fff'; }
        });
}

// ---- Playlist ----
function renderPlaylist() {
    var container = document.getElementById('playlist');
    document.getElementById('playlistCount').textContent = playlist.length;
    if (!playlist.length) {
        container.innerHTML = '<div class="playlist-empty">搜索歌曲后添加到歌单</div>';
        return;
    }
    container.innerHTML = '';
    playlist.forEach(function(s, i) {
        var div = document.createElement('div');
        div.className = 'playlist-item' + (i === currentIdx ? ' playing' : '');
        div.innerHTML = '<span class="idx">' + (i === currentIdx ? '▶' : (i + 1)) + '</span><div class="info"><div class="name">' + s.song_name + '</div><div class="artist">' + s.artist + '</div></div><button class="del-btn" data-id="' + s.id + '">×</button>';
        div.addEventListener('click', function(e) {
            if (e.target.classList.contains('del-btn')) return;
            playIndex(i);
        });
        container.appendChild(div);
    });
    // Delete buttons
    container.querySelectorAll('.del-btn').forEach(function(btn) {
        btn.addEventListener('click', function(e) {
            e.stopPropagation();
            var id = parseInt(this.getAttribute('data-id'));
            sb.from('playlist').delete().eq('id', id).then();
        });
    });
}

function playIndex(i) {
    if (i < 0 || i >= playlist.length) return;
    currentIdx = i;
    var s = playlist[i];
    document.getElementById('playerTitle').textContent = s.song_name;
    document.getElementById('playerArtist').textContent = s.artist;
    document.getElementById('btnPlay').textContent = '⏸';
    renderPlaylist();

    var tryPlay = function(url) {
        if (!url) {
            document.getElementById('playerTitle').textContent = '（无版权）' + s.song_name;
            return;
        }
        audio.src = url;
        audio.play().catch(function() {
            document.getElementById('playerTitle').textContent = '（播放失败）' + s.song_name;
        });
    };

    // Already has a real URL (http/https, not empty)
    if (s.song_url && (s.song_url.indexOf('http') === 0)) {
        tryPlay(s.song_url);
        return;
    }

    // Fetch real URL on demand
    var cid = s.copyright_id || s.song_id;
    var aid = s.album_id || '0';
    fetch(EDGE_FN + '?action=play&copyrightId=' + cid + '&contentId=' + s.song_id + '&albumId=' + aid)
        .then(function(r) { return r.json(); })
        .then(function(data) {
            if (data.url) {
                s.song_url = data.url; // cache
                tryPlay(data.url);
            } else {
                tryPlay(s.song_url);
            }
        })
        .catch(function() { tryPlay(s.song_url); });
}

// ---- Player Controls ----
document.getElementById('btnPlay').addEventListener('click', function() {
    if (currentIdx < 0 && playlist.length > 0) { playIndex(0); return; }
    if (audio.paused) { audio.play(); this.textContent = '⏸'; }
    else { audio.pause(); this.textContent = '▶️'; }
});

document.getElementById('btnPrev').addEventListener('click', function() {
    if (playlist.length === 0) return;
    playIndex(currentIdx <= 0 ? playlist.length - 1 : currentIdx - 1);
});

document.getElementById('btnNext').addEventListener('click', function() {
    if (playlist.length === 0) return;
    playIndex(currentIdx >= playlist.length - 1 ? 0 : currentIdx + 1);
});

audio.addEventListener('timeupdate', function() {
    if (isNaN(audio.duration)) return;
    var m = Math.floor(audio.duration / 60);
    var s = Math.floor(audio.duration % 60);
    var cm = Math.floor(audio.currentTime / 60);
    var cs = Math.floor(audio.currentTime % 60);
    document.getElementById('playerTime').textContent =
        (cm < 10 ? '0' : '') + cm + ':' + (cs < 10 ? '0' : '') + cs + ' / ' +
        (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
});

audio.addEventListener('ended', function() {
    document.getElementById('btnPlay').textContent = '▶️';
    if (currentIdx < playlist.length - 1) playIndex(currentIdx + 1);
});

// ---- Theme + Nav ----
(function() {
    var html = document.documentElement;
    var toggle = document.getElementById('themeToggle');
    function getTheme() {
        var s = localStorage.getItem('theme');
        return s || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
    }
    function apply(t) {
        if (t === 'light') html.setAttribute('data-theme', 'light');
        else html.removeAttribute('data-theme');
    }
    apply(getTheme());
    if (toggle) {
        toggle.addEventListener('click', function() {
            var n = html.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
            apply(n);
            localStorage.setItem('theme', n);
        });
    }
    var nav = document.getElementById('mainNav');
    window.addEventListener('scroll', function() {
        nav.classList.toggle('scrolled', window.scrollY > 10);
    }, { passive: true });
})();

// ---- Init ----
loadRoom();

})();
</script>
