    <!-- Theme Toggle Script -->
    <script>
        (function() {
            var html = document.documentElement;
            var toggle = document.getElementById('themeToggle');

            function getTheme() {
                var saved = localStorage.getItem('theme');
                if (saved) return saved;
                return window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
            }

            function applyTheme(theme) {
                if (theme === 'light') {
                    html.setAttribute('data-theme', 'light');
                } else {
                    html.removeAttribute('data-theme');
                }
            }

            function setTheme(theme) {
                applyTheme(theme);
                localStorage.setItem('theme', theme);
                window.dispatchEvent(new CustomEvent('themechange', { detail: { theme: theme } }));
            }

            applyTheme(getTheme());

            if (toggle) {
                toggle.addEventListener('click', function() {
                    var current = html.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
                    setTheme(current);
                });
            }

            window.matchMedia('(prefers-color-scheme: light)').addEventListener('change', function(e) {
                if (!localStorage.getItem('theme')) {
                    setTheme(e.matches ? 'light' : 'dark');
                }
            });
        })();
    </script>

            var el = document.getElementById('typing-text');
            if (!el) return;

            var wordIndex = 0;
            var charIndex = 0;
            var isDeleting = false;
            var typeSpeed = 50;
            var deleteSpeed = 25;
            var pauseEnd = 3000;
            var pauseStart = 400;

            function tick() {
                var current = words[wordIndex];

                if (isDeleting) {
                    charIndex--;
                    if (charIndex < 0) {
                        isDeleting = false;
                        wordIndex = (wordIndex + 1) % words.length;
                        setTimeout(tick, pauseStart);
                        return;
                    }
                } else {
                    charIndex++;
                    if (charIndex > current.length) {
                        isDeleting = true;
                        setTimeout(tick, pauseEnd);
                        return;
                    }
                }

                el.textContent = current.substring(0, charIndex);
                var delay = isDeleting ? deleteSpeed : typeSpeed;
                setTimeout(tick, delay);
            }

            tick();
        })();

    <!-- Dynamic Island Script -->
    <script>
        (function() {
            var dotEl = document.getElementById('diDot');
            var line1 = document.getElementById('diLine1');
            var line2 = document.getElementById('diLine2');
            if (!line1 || !line2) return;

            var weekdays = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];

            function update() {
                var now = new Date();
                var M = now.getMonth() + 1;
                var d = now.getDate();
                var w = weekdays[now.getDay()];
                var h = now.getHours();
                var m = now.getMinutes();
                var mm = (m < 10 ? '0' : '') + m;
                var timeStr = (h < 10 ? '0' : '') + h + ':' + mm;

                var greeting;
                if (h >= 0 && h < 6) {
                    greeting = '夜深了！';
                    if (dotEl) dotEl.style.background = '#8b5cf6';
                } else if (h >= 6 && h < 12) {
                    greeting = '上午好！';
                    if (dotEl) dotEl.style.background = '#f59e0b';
                } else if (h >= 12 && h < 18) {
                    greeting = '下午好！';
                    if (dotEl) dotEl.style.background = '#34c759';
                } else {
                    greeting = '晚上好！';
                    if (dotEl) dotEl.style.background = '#6366f1';
                }

                line1.textContent = timeStr + '  ' + greeting + (h < 6 ? '，早点休息' : '');
                line2.textContent = M + '月' + d + '日  ' + w;
            }

            update();
            setInterval(update, 10000);
        })();
    </script>
