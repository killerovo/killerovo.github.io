    <!-- Filmstrip Styles -->
    <style>
        .filmstrip-wrapper {
            position: relative;
            z-index: 20;
            width: 100%;
            padding: 48px 0;
            margin-top: -30px;
            margin-bottom: 40px;
        }

        .filmstrip-container {
            position: relative;
            width: 100%;
            background: linear-gradient(180deg, #12122a 0%, #0a0a1e 30%, #0a0a1e 70%, #12122a 100%);
            border-top: 2px solid rgba(99, 102, 241, 0.2);
            border-bottom: 2px solid rgba(99, 102, 241, 0.2);
            padding: 4px 0;
        }

        .filmstrip-sprocket {
            position: absolute;
            left: 0;
            right: 0;
            height: 16px;
            z-index: 3;
            pointer-events: none;
        }

        .filmstrip-sprocket-top {
            top: -8px;
            background: repeating-linear-gradient(
                90deg,
                transparent 0px,
                transparent 15px,
                #06060e 15px,
                #06060e 21px
            );
        }

        .filmstrip-sprocket-bottom {
            bottom: -8px;
            background: repeating-linear-gradient(
                90deg,
                transparent 0px,
                transparent 15px,
                #06060e 15px,
                #06060e 21px
            );
        }

        .filmstrip-viewport {
            position: relative;
            width: 100%;
            height: 280px;
            overflow: hidden;
            display: flex;
            align-items: center;
        }

        .filmstrip-track {
            display: flex;
            align-items: center;
            height: 100%;
            will-change: transform;
        }

        .filmstrip-track img {
            height: 180px;
            width: 180px;
            object-fit: cover;
            border-radius: 8px;
            border: 2px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            flex-shrink: 0;
            margin: 0 5px;
            transition: box-shadow 0.3s ease;
        }

        .filmstrip-track img.center-glow {
            box-shadow: 0 4px 30px rgba(99, 102, 241, 0.4), 0 8px 40px rgba(0, 0, 0, 0.5);
        }

        @media (max-width: 768px) {
            .filmstrip-viewport {
                height: 200px;
            }
            .filmstrip-track img {
                height: 120px;
                width: 120px;
                margin: 0 3px;
            }
            .filmstrip-wrapper {
                padding: 32px 0;
                margin-top: -16px;
                margin-bottom: 24px;
            }
        }

        [data-theme="light"] .filmstrip-container {
            background: linear-gradient(180deg, #e8e8ec 0%, #dddde4 30%, #dddde4 70%, #e8e8ec 100%);
            border-top-color: rgba(79, 70, 229, 0.15);
            border-bottom-color: rgba(79, 70, 229, 0.15);
        }

        [data-theme="light"] .filmstrip-sprocket-top {
            background: repeating-linear-gradient(
                90deg,
                transparent 0px,
                transparent 15px,
                #f0f0f5 15px,
                #f0f0f5 21px
            );
        }

        [data-theme="light"] .filmstrip-sprocket-bottom {
            background: repeating-linear-gradient(
                90deg,
                transparent 0px,
                transparent 15px,
                #f0f0f5 15px,
                #f0f0f5 21px
            );
        }

        [data-theme="light"] .filmstrip-track img {
            border-color: rgba(0, 0, 0, 0.12);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
        }

        [data-theme="light"] .filmstrip-track img.center-glow {
            box-shadow: 0 4px 24px rgba(79, 70, 229, 0.3), 0 8px 32px rgba(0, 0, 0, 0.12);
        }

    <!-- Theme Toggle -->
    <script>
        (function() {
            var html = document.documentElement;
            var toggle = document.getElementById('themeToggle');

            function getTheme() {
                var saved = localStorage.getItem('theme');
                if (saved) return saved;
                return window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
            }

            function applyTheme(theme) {
                if (theme === 'light') {
                    html.setAttribute('data-theme', 'light');
                } else {
                    html.removeAttribute('data-theme');
                }
            }

            function setTheme(theme) {
                applyTheme(theme);
                localStorage.setItem('theme', theme);
                window.dispatchEvent(new CustomEvent('themechange', { detail: { theme: theme } }));
            }

            // Apply on load
            applyTheme(getTheme());

            // Toggle on click
            if (toggle) {
                toggle.addEventListener('click', function() {
                    var current = html.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
                    setTheme(current);
                });
            }

            // Listen for system changes
            window.matchMedia('(prefers-color-scheme: light)').addEventListener('change', function(e) {
                if (!localStorage.getItem('theme')) {
                    setTheme(e.matches ? 'light' : 'dark');
                }
            });
        })();
    </script>

    <!-- Floating Code Particles Background -->
    <script>
        (function() {
            const canvas = document.getElementById('particle-canvas');
            const ctx = canvas.getContext('2d');

            let W, H;
            const PARTICLE_COUNT = 150;
            const particles = [];

            // English letters, numbers, symbols, and Japanese
            const chars = (
                'ABCDEFGHIJKLMNOPQRSTUVWXYZ' +
                'abcdefghijklmnopqrstuvwxyz' +
                '0123456789' +
                '{}[]()<>/\\|#*+-=~^' +
                '!@$%&_?.,:;\'"`' +
                '¥$€£₽₹₿₩' +
                'あいうえおかきくけこさしすせそたちつてとなにぬねのはひふへほまみむめもやゆよらりるれろわをん' +
                'アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲン' +
                'ｦｧｨｩｪｫｬｭｮｯｱｲｳｴｵｶｷｸｹｺｻｼｽｾｿ'
            ).split('');

            var DARK_COLORS = [
                'rgba(129,140,248,ALPHA)',
                'rgba(99,102,241,ALPHA)',
                'rgba(79,70,229,ALPHA)',
                'rgba(6,182,212,ALPHA)',
                'rgba(34,211,238,ALPHA)',
                'rgba(139,92,246,ALPHA)',
                'rgba(167,139,250,ALPHA)',
                'rgba(148,163,184,ALPHA)',
            ];

            var LIGHT_COLORS = [
                'rgba(79,70,229,ALPHA)',
                'rgba(67,56,202,ALPHA)',
                'rgba(55,48,163,ALPHA)',
                'rgba(8,145,178,ALPHA)',
                'rgba(14,116,144,ALPHA)',
                'rgba(109,40,217,ALPHA)',
                'rgba(124,58,237,ALPHA)',
                'rgba(71,85,105,ALPHA)',
            ];

            var colors = document.documentElement.getAttribute('data-theme') === 'light' ? LIGHT_COLORS : DARK_COLORS;

            window.addEventListener('themechange', function(e) {
                colors = e.detail.theme === 'light' ? LIGHT_COLORS : DARK_COLORS;
                for (var i = 0; i < particles.length; i++) {
                    particles[i].color = colors[Math.floor(Math.random() * colors.length)];
                    particles[i].glowColor = colors[Math.floor(Math.random() * 3)];
                }
            });

            function resize() {
                W = canvas.width = window.innerWidth;
                H = canvas.height = window.innerHeight;
            }
            resize();
            window.addEventListener('resize', resize);

            function createParticle() {
                return {
                    x: Math.random() * W,
                    y: Math.random() * H,
                    vx: (Math.random() - 0.5) * 0.6,
                    vy: (Math.random() - 0.5) * 0.6,
                    char: chars[Math.floor(Math.random() * chars.length)],
                    size: 10 + Math.random() * 18,
                    baseAlpha: 0.15 + Math.random() * 0.5,
                    alpha: 0,
                    targetAlpha: 0.15 + Math.random() * 0.5,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    glowColor: colors[Math.floor(Math.random() * 3)],
                    phase: Math.random() * Math.PI * 2,
                    pulseSpeed: 0.003 + Math.random() * 0.008,
                    driftForce: 0.001 + Math.random() * 0.004,
                    wobbleAmp: 0.1 + Math.random() * 0.3,
                };
            }

            // Initialize particles
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                const p = createParticle();
                p.alpha = p.targetAlpha; // Start visible
                particles.push(p);
            }

            let mouseX = -1000, mouseY = -1000;

            document.addEventListener('mousemove', function(e) {
                mouseX = e.clientX;
                mouseY = e.clientY;
            });

            document.addEventListener('mouseleave', function() {
                mouseX = -1000;
                mouseY = -1000;
            });

            function draw(time) {
                ctx.clearRect(0, 0, W, H);

                for (let i = 0; i < PARTICLE_COUNT; i++) {
                    const p = particles[i];

                    // Organic drifting motion
                    p.vx += (Math.sin(time * p.driftForce + p.phase) * p.wobbleAmp) * 0.01;
                    p.vy += (Math.cos(time * p.driftForce * 1.3 + p.phase) * p.wobbleAmp) * 0.01;

                    // Gentle random nudges
                    p.vx += (Math.random() - 0.5) * 0.02;
                    p.vy += (Math.random() - 0.5) * 0.02;

                    // Mouse interaction - subtle attraction
                    const dx = mouseX - p.x;
                    const dy = mouseY - p.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < 200 && dist > 0) {
                        const force = (200 - dist) / 200 * 0.003;
                        p.vx += (dx / dist) * force;
                        p.vy += (dy / dist) * force;
                    }

                    // Damping
                    const speed = Math.sqrt(p.vx * p.vx + p.vy * p.vy);
                    const maxSpeed = 0.8;
                    if (speed > maxSpeed) {
                        p.vx = (p.vx / speed) * maxSpeed;
                        p.vy = (p.vy / speed) * maxSpeed;
                    }
                    if (speed < 0.05) {
                        p.vx += (Math.random() - 0.5) * 0.04;
                        p.vy += (Math.random() - 0.5) * 0.04;
                    }

                    // Move
                    p.x += p.vx;
                    p.y += p.vy;

                    // Wrap around edges
                    if (p.x < -20) p.x = W + 20;
                    if (p.x > W + 20) p.x = -20;
                    if (p.y < -20) p.y = H + 20;
                    if (p.y > H + 20) p.y = -20;

                    // Pulse alpha
                    p.targetAlpha = p.baseAlpha + Math.sin(time * p.pulseSpeed + p.phase) * 0.15;
                    p.alpha += (p.targetAlpha - p.alpha) * 0.02;

                    const alpha = Math.max(0.05, Math.min(0.8, p.alpha));

                    // Draw glow
                    ctx.save();
                    ctx.shadowBlur = 8;
                    ctx.shadowColor = p.glowColor.replace('ALPHA', '0.4');
                    ctx.globalAlpha = alpha * 0.5;
                    ctx.font = 'bold ' + p.size + 'px "Courier New", "MS Gothic", monospace';
                    ctx.fillStyle = p.glowColor.replace('ALPHA', '1');
                    ctx.fillText(p.char, p.x, p.y);
                    ctx.restore();

                    // Draw character
                    ctx.font = 'bold ' + p.size + 'px "Courier New", "MS Gothic", monospace';
                    ctx.fillStyle = p.color.replace('ALPHA', String(alpha));
                    ctx.fillText(p.char, p.x, p.y);
                }

                // Occasionally spawn fresh particles to replace stale ones
                if (Math.random() < 0.02) {
                    const idx = Math.floor(Math.random() * PARTICLE_COUNT);
                    particles[idx] = createParticle();
                }

                requestAnimationFrame(draw);
            }

            requestAnimationFrame(draw);
        })();
    </script>

    <script>
        (function() {
            var canvas = document.getElementById('letter-storm-canvas');
            if (!canvas) return;
            var ctx = canvas.getContext('2d');

            var WORD = 'AI';
            var CHARSET = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789{}[]()<>/\\|#*+-=~^!@$%&_?.,:;\'"`αβγδεζηθικλμνξπρστυφχψω∀∃∈∑∫∂√∞≈≠≤≥'.split('');

            var DARK_COLS  = ['#6366f1','#818cf8','#06b6d4','#22d3ee','#8b5cf6','#a78bfa','#c4b5fd','#94a3b8'];
            var LIGHT_COLS = ['#4f46e5','#4338ca','#0891b2','#0e7490','#7c3aed','#6d28d9','#8b5cf6','#475569'];
            var COLORS = document.documentElement.getAttribute('data-theme') === 'light' ? LIGHT_COLS : DARK_COLS;

            window.addEventListener('themechange', function(e) {
                COLORS = e.detail.theme === 'light' ? LIGHT_COLS : DARK_COLS;
                for (var i = 0; i < particles.length; i++) {
                    particles[i].cl = COLORS[Math.floor(Math.random() * COLORS.length)];
                }
            });

            var DUR = { chaos: 4000, form: 2800, hold: 2200, dissolve: 2800 };
            var ST = { CHAOS: 0, FORM: 1, HOLD: 2, DISSOLVE: 3 };

            var W, H, state = ST.CHAOS, stateT0 = 0;
            var particles = [], targets = [];
            var cx, cy;

            function buildTargets() {
                if (W < 200 || H < 80) return [];
                var bw = Math.max(100, Math.floor(W / 7));
                var bh = Math.max(30,  Math.floor(H / 7));
                var oc = document.createElement('canvas');
                oc.width = bw; oc.height = bh;
                var octx = oc.getContext('2d');
                var fs = Math.floor(bh * 0.72);
                octx.font = '900 ' + fs + 'px "Courier New","Consolas",monospace';
                octx.textAlign = 'center';
                octx.textBaseline = 'middle';
                octx.fillStyle = '#fff';
                octx.fillText(WORD, bw/2, bh/2);
                var img = octx.getImageData(0, 0, bw, bh);
                var pts = [];
                var step = Math.max(1, Math.floor(Math.min(bw, bh) / 55));
                var sx = W / bw, sy = H / bh;
                for (var y = 0; y < bh; y += step) {
                    for (var x = 0; x < bw; x += step) {
                        if (img.data[(y * bw + x) * 4 + 3] > 100) {
                            pts.push({ x: (x + 0.5) * sx, y: (y + 0.5) * sy });
                        }
                    }
                }
                return pts;
            }

            function mkParticle() {
                var a = Math.random() * Math.PI * 2;
                var r = 30 + Math.random() * Math.min(W, H) * 0.45;
                return {
                    x: cx + Math.cos(a) * r,
                    y: cy + Math.sin(a) * r,
                    vx: (Math.random() - 0.5) * 0.5,
                    vy: (Math.random() - 0.5) * 0.5,
                    ch: CHARSET[Math.floor(Math.random() * CHARSET.length)],
                    sz: 9 + Math.random() * 7,
                    cl: COLORS[Math.floor(Math.random() * COLORS.length)],
                    ph: Math.random() * Math.PI * 2,
                    sx: 0, sy: 0,
                    tx: -1, ty: -1
                };
            }

            function resetAll() {
                cx = W / 2; cy = H / 2;
                targets = buildTargets();
                var N = Math.max(targets.length + 150, 600);
                particles = [];
                for (var i = 0; i < targets.length; i++) {
                    var p = mkParticle();
                    p.tx = targets[i].x;
                    p.ty = targets[i].y;
                    var a = Math.random() * Math.PI * 2;
                    var r = Math.min(W, H) * (0.3 + Math.random() * 0.4);
                    p.x = cx + Math.cos(a) * r;
                    p.y = cy + Math.sin(a) * r;
                    particles.push(p);
                }
                for (var i = targets.length; i < N; i++) {
                    particles.push(mkParticle());
                }
                state = ST.CHAOS;
                stateT0 = performance.now();
            }

            var resizeTimer;
            function onResize() {
                clearTimeout(resizeTimer);
                resizeTimer = setTimeout(function() {
                    var pw = canvas.parentElement.clientWidth;
                    W = canvas.width  = Math.min(pw - 40, 1100);
                    H = canvas.height = Math.min(window.innerHeight * 0.52, 500);
                    resetAll();
                }, 200);
            }
            window.addEventListener('resize', onResize);

            function easeOutBack(t) {
                var c1 = 1.70158, c3 = c1 + 1;
                return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
            }
            function easeInOutCubic(t) {
                return t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2;
            }

            function update(now) {
                var elapsed = now - stateT0;
                var progress = 0;

                if (state === ST.CHAOS && elapsed >= DUR.chaos) {
                    state = ST.FORM; stateT0 = now;
                    for (var i = 0; i < particles.length; i++) {
                        var p = particles[i];
                        if (p.tx >= 0) { p.sx = p.x; p.sy = p.y; }
                    }
                } else if (state === ST.FORM) {
                    progress = Math.min(1, elapsed / DUR.form);
                    if (elapsed >= DUR.form) { state = ST.HOLD; stateT0 = now; }
                } else if (state === ST.HOLD && elapsed >= DUR.hold) {
                    state = ST.DISSOLVE; stateT0 = now;
                    for (var i = 0; i < particles.length; i++) {
                        var p = particles[i];
                        if (p.tx >= 0) { p.sx = p.x; p.sy = p.y; }
                    }
                } else if (state === ST.DISSOLVE) {
                    progress = Math.min(1, elapsed / DUR.dissolve);
                    if (elapsed >= DUR.dissolve) { state = ST.CHAOS; stateT0 = now; }
                }

                // Update particles
                for (var i = 0; i < particles.length; i++) {
                    var p = particles[i];
                    var hasT = p.tx >= 0;

                    if (state === ST.CHAOS) {
                        var dx = p.x - cx, dy = p.y - cy;
                        var dist = Math.sqrt(dx*dx + dy*dy) + 0.1;
                        var ang = Math.atan2(dy, dx);
                        var v1 = 0.4 + 0.3 * Math.sin(dist * 0.008 + p.ph);
                        var v2 = 0.15 * Math.sin(dist * 0.025 - now * 0.0004);
                        p.vx += Math.cos(ang + Math.PI/2 + v2) * v1 * 0.06;
                        p.vy += Math.sin(ang + Math.PI/2 + v2) * v1 * 0.06;
                        p.vx += Math.sin(p.y * 0.015 + now * 0.0008 + p.ph) * 0.07;
                        p.vy += Math.cos(p.x * 0.018 + now * 0.0011 + p.ph) * 0.07;
                        p.vx += (Math.random() - 0.5) * 0.15;
                        p.vy += (Math.random() - 0.5) * 0.15;
                        var spd = Math.sqrt(p.vx*p.vx + p.vy*p.vy);
                        if (spd > 3.5) { p.vx *= 3.5 / spd; p.vy *= 3.5 / spd; }
                        if (spd < 0.15) { p.vx += (Math.random() - 0.5) * 0.3; p.vy += (Math.random() - 0.5) * 0.3; }
                        p.x += p.vx; p.y += p.vy;
                        var mrg = 30;
                        if (p.x < -mrg) p.x = W + mrg;
                        if (p.x > W + mrg) p.x = -mrg;
                        if (p.y < -mrg) p.y = H + mrg;
                        if (p.y > H + mrg) p.y = -mrg;
                    } else if (state === ST.FORM) {
                        if (hasT) {
                            var t = easeOutBack(progress);
                            p.x = p.sx + (p.tx - p.sx) * t + (Math.random() - 0.5) * (1 - t) * 4;
                            p.y = p.sy + (p.ty - p.sy) * t + (Math.random() - 0.5) * (1 - t) * 4;
                        }
                    } else if (state === ST.HOLD) {
                        if (hasT) {
                            p.x = p.tx + Math.sin(now * 0.002 + p.ph) * 0.8;
                            p.y = p.ty + Math.cos(now * 0.0023 + p.ph) * 0.8;
                        }
                    } else if (state === ST.DISSOLVE) {
                        if (hasT) {
                            var t = easeInOutCubic(progress);
                            var da = Math.atan2(p.sy - cy, p.sx - cx);
                            var dr = 450 * t * t + (Math.random() - 0.5) * 200 * t;
                            p.x = p.sx + Math.cos(da + (Math.random() - 0.5) * 3 * t) * dr;
                            p.y = p.sy + Math.sin(da + (Math.random() - 0.5) * 3 * t) * dr;
                        }
                    }

                    // Ambient particles continue swirling
                    if (!hasT && state !== ST.CHAOS) {
                        var dx = p.x - cx, dy = p.y - cy;
                        var dist = Math.sqrt(dx*dx + dy*dy) + 0.1;
                        var ang = Math.atan2(dy, dx);
                        p.vx += Math.cos(ang + Math.PI/2) * 0.15 * 0.06;
                        p.vy += Math.sin(ang + Math.PI/2) * 0.15 * 0.06;
                        p.vx += (Math.random() - 0.5) * 0.1;
                        p.vy += (Math.random() - 0.5) * 0.1;
                        var spd = Math.sqrt(p.vx*p.vx + p.vy*p.vy);
                        if (spd > 2) { p.vx *= 2 / spd; p.vy *= 2 / spd; }
                        p.x += p.vx; p.y += p.vy;
                        var mrg = 30;
                        if (p.x < -mrg) p.x = W + mrg;
                        if (p.x > W + mrg) p.x = -mrg;
                        if (p.y < -mrg) p.y = H + mrg;
                        if (p.y > H + mrg) p.y = -mrg;
                    }
                }
            }

            function render(now) {
                ctx.clearRect(0, 0, W, H);
                for (var i = 0; i < particles.length; i++) {
                    var p = particles[i];
                    var alpha;
                    if (state === ST.CHAOS) alpha = 0.25 + (p.ph % 0.35);
                    else if (state === ST.FORM) alpha = 0.5;
                    else if (state === ST.HOLD) alpha = 0.85;
                    else alpha = 0.5;
                    alpha = Math.max(0.15, Math.min(0.9, alpha));

                    ctx.save();
                    ctx.shadowBlur = (state === ST.HOLD) ? 8 : 4;
                    ctx.shadowColor = p.cl;
                    ctx.globalAlpha = alpha * 0.35;
                    ctx.font = 'bold ' + p.sz + 'px "Courier New",monospace';
                    ctx.fillStyle = p.cl;
                    ctx.fillText(p.ch, p.x, p.y);
                    ctx.restore();

                    ctx.font = 'bold ' + p.sz + 'px "Courier New",monospace';
                    ctx.fillStyle = p.cl;
                    ctx.globalAlpha = alpha;
                    ctx.fillText(p.ch, p.x, p.y);
                    ctx.globalAlpha = 1;
                }
            }

            function loop(now) {
                update(now);
                render(now);
                requestAnimationFrame(loop);
            }

            // Init
            var pw = canvas.parentElement.clientWidth;
            W = canvas.width  = Math.min(pw - 40, 1100);
            H = canvas.height = Math.min(window.innerHeight * 0.52, 500);
            resetAll();
            requestAnimationFrame(loop);
        })();
    </script>

    <!-- 3D Rubik's Cube Script -->
    <script>
        (function() {
            var container = document.getElementById('cube-container');
            if (!container) return;
            var scene, camera, renderer, cubeGroup;
            var isDragging = false;
            var prevMouse = { x: 0, y: 0 };
            var autoRotate = true;
            var autoRotateTimeout;

            var C = {
                bg: '#0c0c1d',
                primary: '#6366f1',
                secondary: '#06b6d4',
                accent: '#8b5cf6',
                dark: '#06060e',
                border: '#818cf8',
                white: '#e8e8f0'
            };

            function createFaceTexture(index) {
                var canvas = document.createElement('canvas');
                canvas.width = 256;
                canvas.height = 256;
                var ctx = canvas.getContext('2d');
                ctx.fillStyle = C.dark;
                ctx.fillRect(0, 0, 256, 256);
                ctx.strokeStyle = C.primary;
                ctx.lineWidth = 2.5;
                ctx.strokeRect(8, 8, 240, 240);
                var patterns = getPattern(index);
                ctx.font = '11px "Courier New", monospace';
                ctx.textAlign = 'center';
                patterns.forEach(function(row, ri) {
                    var chars = row.split('');
                    chars.forEach(function(ch, ci) {
                        var x = 28 + ci * 11;
                        var y = 28 + ri * 13;
                        var brightness = 0.65 + Math.random() * 0.35;
                        ctx.globalAlpha = brightness;
                        ctx.fillStyle = C.primary;
                        ctx.fillText(ch, x, y);
                    });
                });
                ctx.globalAlpha = 1;
                var tex = new THREE.CanvasTexture(canvas);
                tex.needsUpdate = true;
                return tex;
            }

            function getPattern(index) {
                var patterns = [
                    ['    +------------+    ','   +--------------+   ','  +----------------+  ',' +----++----++----+ ','+----++------++----+','|------------------|','|------++++++------|','|-----+------+-----|','|------------------|','+----+--------+----+',' +---+--------+---+ ','  +--------------+  ','   +------------+   '],
                    ['    *               ','    |               ','    |               ','    +------*        ','    |      |        ','    |      |        ','    +------+        ','    |      |        ','    |      +-----*  ','    |      |     |  ','    *------+-----*  ','    |      |        ','    *               '],
                    ['+------------------+','| function() {     |','|   return {       |','|     code: true,  |','|     love: "git"  |','|   };            |','| }                |','|                  |','| git push origin  |','| git merge main   |','| git commit -m    |','|                  |','+------------------+'],
                    ['    ++      ++    ','  ++++++  ++++++  ',' ++++++++++++++++ ','++++  ++++++  ++++','++++          ++++','++++  ++++++  ++++','++++          ++++',' +++++    ++++++ ','  ++++++++++++++  ','   +++++  +++++   ','  ++ ++  ++ ++  ',' ++  ++  ++  ++ ','++            ++'],
                    ['                  ','   ///////////\\\\\\   ','  /////////////\\\\\\  ',' ///////////////\\\\\\ ','/               \\','|                |','|                |','|                |','\\               /',' \\\\\\\\\\\\\\///////////////// ','  \\\\\\\\\\\\///////////////  ','   \\\\\\\\\\/////////////   ','                  '],
                    ['+------------------+','|                  |','| ++++++++++++++  |','| +              + |','| +   ++  ++    + |','| +              + |','| +    +++++     + |','| +              + |','| +              + |','| +              + |','|  +            +  |','|   ++++++++++++   |','+------------------+']
                ];
                return patterns[index % patterns.length];
            }

            function createCubelet(x, y, z, textures) {
                var geo = new THREE.BoxGeometry(0.95, 0.95, 0.95);
                var mats = [];
                var faceMap = {
                    right: x === 1 ? 0 : -1,
                    left: x === -1 ? 1 : -1,
                    top: y === 1 ? 2 : -1,
                    bottom: y === -1 ? 3 : -1,
                    front: z === 1 ? 4 : -1,
                    back: z === -1 ? 5 : -1
                };
                ['right', 'left', 'top', 'bottom', 'front', 'back'].forEach(function(name) {
                    var ti = faceMap[name];
                    if (ti >= 0) {
                        mats.push(new THREE.MeshStandardMaterial({
                            map: textures[ti], roughness: 0.35, metalness: 0.15,
                            emissive: new THREE.Color(C.primary), emissiveIntensity: 0.04
                        }));
                    } else {
                        mats.push(new THREE.MeshStandardMaterial({
                            color: 0x0c0c1d, roughness: 0.7, metalness: 0.05
                        }));
                    }
                });
                var cube = new THREE.Mesh(geo, mats);
                cube.position.set(x, y, z);
                var edgeGeo = new THREE.EdgesGeometry(geo);
                var edgeMat = new THREE.LineBasicMaterial({ color: C.primary, transparent: true, opacity: 0.5 });
                cube.add(new THREE.LineSegments(edgeGeo, edgeMat));
                return cube;
            }

            function createCube() {
                cubeGroup = new THREE.Group();
                scene.add(cubeGroup);
                var textures = [];
                for (var i = 0; i < 6; i++) textures.push(createFaceTexture(i));
                for (var x = -1; x <= 1; x++)
                    for (var y = -1; y <= 1; y++)
                        for (var z = -1; z <= 1; z++)
                            cubeGroup.add(createCubelet(x, y, z, textures));
            }

            function init() {
                var W = container.clientWidth || 300;
                var H = container.clientHeight || 300;
                scene = new THREE.Scene();
                camera = new THREE.PerspectiveCamera(40, W / H, 0.1, 100);
                camera.position.set(4.5, 3.5, 5.5);
                camera.lookAt(0, 0, 0);
                renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
                renderer.setSize(W, H);
                renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
                container.appendChild(renderer.domElement);
                scene.add(new THREE.AmbientLight(0xffffff, 0.4));
                var ml = new THREE.DirectionalLight(C.primary, 0.9); ml.position.set(5, 10, 5); scene.add(ml);
                var fl = new THREE.DirectionalLight(C.secondary, 0.5); fl.position.set(-5, 5, -5); scene.add(fl);
                var rl = new THREE.DirectionalLight(C.accent, 0.35); rl.position.set(0, -5, 10); scene.add(rl);
                var pl = new THREE.PointLight(C.primary, 0.4, 20); pl.position.set(0, 0, 5); scene.add(pl);
                createCube();
                renderer.domElement.addEventListener('mousedown', onDown);
                renderer.domElement.addEventListener('mousemove', onMove);
                renderer.domElement.addEventListener('mouseup', onUp);
                renderer.domElement.addEventListener('mouseleave', onUp);
                renderer.domElement.addEventListener('wheel', onWheel, { passive: false });
                renderer.domElement.addEventListener('touchstart', onTouchStart, { passive: false });
                renderer.domElement.addEventListener('touchmove', onTouchMove, { passive: false });
                renderer.domElement.addEventListener('touchend', onTouchEnd);
                window.addEventListener('resize', onResize);
                animate();
            }

            function onDown(e) {
                isDragging = true; autoRotate = false;
                clearTimeout(autoRotateTimeout);
                prevMouse.x = e.clientX; prevMouse.y = e.clientY;
            }
            function onMove(e) {
                if (!isDragging) return;
                cubeGroup.rotation.y += (e.clientX - prevMouse.x) * 0.008;
                cubeGroup.rotation.x += (e.clientY - prevMouse.y) * 0.008;
                prevMouse.x = e.clientX; prevMouse.y = e.clientY;
            }
            function onUp() {
                isDragging = false;
                autoRotateTimeout = setTimeout(function() { if (!isDragging) autoRotate = true; }, 2500);
            }
            function onWheel(e) {
                e.preventDefault();
                camera.position.multiplyScalar(1 + e.deltaY * 0.0008);
                camera.position.clampLength(3.5, 14);
            }
            var touchStart = { x: 0, y: 0 };
            function onTouchStart(e) {
                e.preventDefault();
                if (e.touches.length === 1) {
                    isDragging = true; autoRotate = false;
                    clearTimeout(autoRotateTimeout);
                    touchStart.x = e.touches[0].clientX;
                    touchStart.y = e.touches[0].clientY;
                }
            }
            function onTouchMove(e) {
                e.preventDefault();
                if (!isDragging || e.touches.length !== 1) return;
                cubeGroup.rotation.y += (e.touches[0].clientX - touchStart.x) * 0.008;
                cubeGroup.rotation.x += (e.touches[0].clientY - touchStart.y) * 0.008;
                touchStart.x = e.touches[0].clientX;
                touchStart.y = e.touches[0].clientY;
            }
            function onTouchEnd() {
                isDragging = false;
                autoRotateTimeout = setTimeout(function() { if (!isDragging) autoRotate = true; }, 2500);
            }
            function onResize() {
                var W = container.clientWidth || 300;
                var H = container.clientHeight || 300;
                camera.aspect = W / H;
                camera.updateProjectionMatrix();
                renderer.setSize(W, H);
            }
            function animate() {
                requestAnimationFrame(animate);
                if (autoRotate) {
                    cubeGroup.rotation.y += 0.004;
                    cubeGroup.rotation.x = Math.sin(Date.now() * 0.00025) * 0.15;
                }
                renderer.render(scene, camera);
            }

            setTimeout(init, 100);
        })();
    </script>

        <!-- Filmstrip Animation -->
    <script>
        (function() {
            var viewport = document.getElementById('filmstrip-viewport');
            var track = document.getElementById('filmstrip-track');
            if (!viewport || !track) {
                console.warn('Filmstrip: viewport or track not found');
                return;
            }

            var wrapper = document.getElementById('avatar');
            if (wrapper) wrapper.style.opacity = '1';

            var IMAGE_COUNT = 20;
            var IMG_SIZE = 180;
            var GAP = 5;
            var STEP = IMG_SIZE + GAP * 2;
            var ONE_SET = IMAGE_COUNT * STEP;
            var MAX_SCALE = 1.7;
            var MIN_SCALE = 0.55;
            var BASE_SPEED = 1.2;

            // Auto-scroll state
            var autoSpeed = BASE_SPEED;
            var inertiaSpeed = 0;

            // Drag state
            var isDragging = false;
            var dragStartX = 0;
            var scrollAtDragStart = 0;
            var lastDragX = 0;
            var lastDragT = 0;

            // Create 2 copies of images for seamless looping
            for (var copy = 0; copy < 2; copy++) {
                for (var i = 1; i <= IMAGE_COUNT; i++) {
                    var img = document.createElement('img');
                    img.src = 'Cat/' + i + '.jpeg';
                    img.alt = 'Cat ' + i;
                    img.style.width = IMG_SIZE + 'px';
                    img.style.height = IMG_SIZE + 'px';
                    img.draggable = false;
                    img.onerror = function() {
                        this.style.display = 'none';
                        console.warn('Filmstrip: failed to load ' + this.src);
                    };
                    track.appendChild(img);
                }
            }

            var allImages = track.querySelectorAll('img');
            var TOTAL = allImages.length;
            var scrollX = 0;

            function wrapX(x) {
                while (x >= ONE_SET) x -= ONE_SET;
                while (x < 0) x += ONE_SET;
                return x;
            }

            // ---- Mouse drag ----
            viewport.addEventListener('mousedown', function(e) {
                isDragging = true;
                inertiaSpeed = 0;
                dragStartX = e.clientX;
                scrollAtDragStart = scrollX;
                lastDragX = e.clientX;
                lastDragT = performance.now();
                viewport.style.cursor = 'grabbing';
                e.preventDefault();
            });

            window.addEventListener('mousemove', function(e) {
                if (!isDragging) return;
                var dx = e.clientX - dragStartX;
                scrollX = wrapX(scrollAtDragStart - dx);
                var now = performance.now();
                var dt = now - lastDragT;
                if (dt > 0) {
                    inertiaSpeed = -(e.clientX - lastDragX) / dt * 16;
                }
                lastDragX = e.clientX;
                lastDragT = now;
            });

            window.addEventListener('mouseup', function() {
                if (!isDragging) return;
                isDragging = false;
                viewport.style.cursor = '';
                autoSpeed = 0;
                if (Math.abs(inertiaSpeed) < 0.3) inertiaSpeed = 0;
            });

            // ---- Touch swipe ----
            viewport.addEventListener('touchstart', function(e) {
                if (e.touches.length === 1) {
                    isDragging = true;
                    inertiaSpeed = 0;
                    dragStartX = e.touches[0].clientX;
                    scrollAtDragStart = scrollX;
                    lastDragX = e.touches[0].clientX;
                    lastDragT = performance.now();
                }
            }, { passive: false });

            window.addEventListener('touchmove', function(e) {
                if (!isDragging || e.touches.length !== 1) return;
                var dx = e.touches[0].clientX - dragStartX;
                scrollX = wrapX(scrollAtDragStart - dx);
                var now = performance.now();
                var dt = now - lastDragT;
                if (dt > 0) {
                    inertiaSpeed = -(e.touches[0].clientX - lastDragX) / dt * 16;
                }
                lastDragX = e.touches[0].clientX;
                lastDragT = now;
                e.preventDefault();
            }, { passive: false });

            window.addEventListener('touchend', function() {
                if (!isDragging) return;
                isDragging = false;
                autoSpeed = 0;
                if (Math.abs(inertiaSpeed) < 0.3) inertiaSpeed = 0;
            });

            function animate() {
                if (!isDragging) {
                    if (Math.abs(inertiaSpeed) > 0.01) {
                        scrollX += inertiaSpeed;
                        inertiaSpeed *= 0.965;
                    } else {
                        inertiaSpeed = 0;
                        // Ramp autoSpeed back to BASE_SPEED
                        if (autoSpeed < BASE_SPEED) {
                            autoSpeed += (BASE_SPEED - autoSpeed) * 0.02 + 0.01;
                            if (autoSpeed > BASE_SPEED) autoSpeed = BASE_SPEED;
                        }
                        scrollX += autoSpeed;
                    }
                    scrollX = wrapX(scrollX);
                }

                var vpWidth = viewport.clientWidth;
                if (vpWidth === 0) {
                    requestAnimationFrame(animate);
                    return;
                }

                var vpCenter = vpWidth / 2;
                var influence = Math.max(vpWidth * 0.55, 400);
                var step = STEP;
                var imgSize = IMG_SIZE;

                for (var i = 0; i < TOTAL; i++) {
                    var imgCenter = i * step + imgSize / 2 - scrollX;
                    var dist = Math.abs(imgCenter - vpCenter);
                    var t = Math.min(dist / influence, 1.0);
                    var eased = 1 - Math.pow(1 - t, 2);
                    var scale = MAX_SCALE - eased * (MAX_SCALE - MIN_SCALE);
                    var opacity = 0.45 + (1 - t) * 0.55;

                    var img = allImages[i];
                    img.style.transform = 'scale(' + scale.toFixed(3) + ')';
                    img.style.opacity = opacity.toFixed(3);
                    img.style.zIndex = Math.floor(scale * 100);

                    if (t < 0.2) {
                        img.classList.add('center-glow');
                    } else {
                        img.classList.remove('center-glow');
                    }
                }

                track.style.transform = 'translateX(' + (-scrollX).toFixed(2) + 'px)';
                requestAnimationFrame(animate);
            }

            requestAnimationFrame(animate);
        })();
    </script>
