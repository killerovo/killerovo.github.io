  <style>
    :root {
      --bg-primary: #0d0d12;
      --bg-secondary: #14141a;
      --text-primary: #ededef;
      --text-secondary: #9999a0;
      --text-tertiary: #666670;
      --accent: #f472b6;
      --accent-alt: #60a5fa;
      --border-light: #1e1e28;
      --card-bg: rgba(28, 28, 38, 0.65);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    /* ---- 验证门控 ---- */
    #auth-gate {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; align-items: center; justify-content: center;
      background: rgba(8,8,16,0.96);
      backdrop-filter: blur(18px);
      flex-direction: column; gap: 24px; padding: 32px;
      transition: opacity 0.6s ease, visibility 0.6s ease;
    }
    #auth-gate.hidden {
      opacity: 0; visibility: hidden; pointer-events: none;
    }
    .auth-card {
      background: rgba(22,24,42,0.96);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 20px; padding: 40px 36px 32px;
      max-width: 420px; width: 100%;
      text-align: center;
      box-shadow: 0 24px 60px rgba(0,0,0,0.5);
      position: relative;
    }
    .auth-card::before {
      content: ''; position: absolute; inset: 0; border-radius: 20px; padding: 1px;
      background: linear-gradient(155deg, rgba(255,255,255,0.08), rgba(255,255,255,0.02) 60%, rgba(255,255,255,0.06));
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor; mask-composite: exclude;
      pointer-events: none;
    }
    .auth-card p {
      font-size: 15px; color: rgba(210,210,225,0.65); margin-bottom: 24px;
      line-height: 1.7; letter-spacing: 0.03em;
    }
    .auth-input {
      width: 100%; padding: 14px 18px; border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.04);
      color: #ededef; font-size: 16px; text-align: center;
      outline: none; transition: border-color 0.25s, box-shadow 0.25s;
      font-family: "SF Mono","Fira Code","Consolas",monospace;
      letter-spacing: 0.04em;
    }
    .auth-input:focus {
      border-color: rgba(255,255,255,0.22);
      box-shadow: 0 0 20px rgba(255,255,255,0.05);
    }
    .auth-input::placeholder {
      color: rgba(180,175,200,0.3); font-family: inherit;
    }
    .auth-btn {
      margin-top: 16px; padding: 12px 40px; border-radius: 10px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.12);
      color: rgba(235,232,245,0.8); font-size: 15px; cursor: pointer;
      font-weight: 500; letter-spacing: 0.05em;
      transition: all 0.25s ease;
    }
    .auth-btn:hover {
      background: rgba(255,255,255,0.16);
      color: #fff;
      border-color: rgba(255,255,255,0.22);
    }
    .auth-back {
      display: block; margin-top: 12px;
      font-size: 12px; color: rgba(255,255,255,0.3);
      cursor: pointer; text-decoration: none;
      transition: color 0.2s;
    }
    .auth-back:hover { color: rgba(255,255,255,0.55); }
    .auth-error {
      margin-top: 12px; font-size: 13px; color: rgba(255,180,180,0.75);
      min-height: 20px; letter-spacing: 0.03em;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: transparent;
      color: #ededef;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;

      position: relative;
      z-index: 0;

      background: url('static/assets/jasmine-bg.webp') center/cover no-repeat;
      opacity: 0;
      animation: uiBgFadeIn 0.6s ease forwards;
      z-index: -1;
      pointer-events: none;
    }
    @keyframes uiBgFadeIn {
      to { opacity: 0.28; }
    }

    /* 主页按钮 */
    .home-link {

      transition: color 0.2s, border-color 0.2s;
      z-index: 100;
    }
    .home-link:hover { color: var(--accent); border-color: var(--accent); }

    }

      letter-spacing: 0.12em; margin-bottom: 12px;
      color: var(--text-primary);
      font-weight: 700;
    }

      font-size: 16px; color: var(--text-secondary);
    }

    }

      50%     { opacity: 1;    transform: scale(1.07); }

    /* 内容区 */
    .content { display: none; text-align: center; padding: 20px 16px 60px; width: 100%; max-width: 1000px; }

    /* 双卡片计时器 —— 高级感磨砂玻璃 */
    .clocks {
      display: flex; justify-content: center; gap: 36px;
      flex-wrap: wrap; margin-bottom: 48px;
    }
    .clock-card {
      position: relative;
      padding: 32px 40px; border-radius: 20px;
      background: rgba(255,255,255,0.03);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.06);
      min-width: 320px; flex: 1; max-width: 400px;
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.03),
        0 8px 32px rgba(0,0,0,0.3);
      overflow: hidden;
    }
    .clock-card::before {
      content: '';
      position: absolute; inset: 0; border-radius: 20px; padding: 1px;
      background: linear-gradient(155deg, rgba(255,255,255,0.1), rgba(255,255,255,0.02) 50%, rgba(244,114,182,0.15));
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor; mask-composite: exclude;
      pointer-events: none;
    }
    .clock-card .label { font-size: 15px; color: rgba(220,210,225,0.65); margin-bottom: 6px; font-weight: 600; letter-spacing: 0.06em; position: relative; }
    .clock-card .date  { font-size: 13px; color: rgba(200,190,210,0.4); margin-bottom: 16px; font-weight: 400; letter-spacing: 0.04em; position: relative; }
    .clock-card .timer {

    /* 打字机 */
    .typewriter-box {

      padding: 28px 40px;

      justify-content: center;
    }
    .typewriter {

      text-align: center; white-space: pre-wrap; word-break: break-word;
    }
    .cursor {
      font-size: 22px; color: var(--accent);

      margin-left: 2px;

    @media (max-width: 768px) {

    <p>Every story begins with a single moment.</p>
    <div class="hint" id="hint">&gt; 点击这里，开始我们的故事 &lt;</div>
  </div>

    <div class="clocks" id="clocks">
      <div class="clock-card">
        <div class="label">💫 我们的故事开始于</div>
        <div class="date">2026年3月4日</div>
        <div class="timer" id="timerMeet">
          <span class="digit">0</span> 天 <span class="digit">00</span> 时 <span class="digit">00</span> 分 <span class="digit">00</span> 秒
        </div>
      </div>
      <div class="clock-card">
        <div class="label">💕 我们在一起的时间</div>
        <div class="date">2026年6月6日</div>
        <div class="timer" id="timerTogether">
          <span class="digit">0</span> 天 <span class="digit">00</span> 时 <span class="digit">00</span> 分 <span class="digit">00</span> 秒
        </div>
      </div>
    </div>

    <!-- 打字机 -->

  <!-- Auth Gate -->
  <script>
  (function() {
    var gate    = document.getElementById('auth-gate');
    var input   = document.getElementById('auth-input');
    var btn     = document.getElementById('auth-btn');
    var errEl   = document.getElementById('auth-error');
    if (!gate || !input) return;

    function normalize(str) {
      var m = str.match(/(\d{4})\D*(\d{1,2})\D*(\d{1,2})/);
      if (!m) return null;
      return m[1] + '-' + m[2].padStart(2,'0') + '-' + m[3].padStart(2,'0');
    }

    var correct = ['2026-03-04', '2026-06-06'];
    var attempts = 0;

    function check() {
      var raw = input.value.trim();
      var norm = normalize(raw);
      if (!norm) {
        errEl.textContent = '格式不对哦，请输入 XXXX年XX月XX日';
        return;
      }
      if (correct.indexOf(norm) !== -1) {
        gate.classList.add('hidden');
        // 滚动到入口区域
        var introEl = document.getElementById('intro');
        if (introEl) { introEl.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
      } else {
        attempts++;
        if (attempts >= 3) {
          window.location.href = 'index.html';
        } else {
          errEl.textContent = '不是这个日期哦，再想想～（还剩 ' + (3 - attempts) + ' 次）';
          input.value = '';
        }
      }
    }

    btn.addEventListener('click', check);
    input.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') check();
    });
    setTimeout(function() { input.focus(); }, 300);
  })();
  </script>

        var h = Math.floor(r / 3600);
        r = r % 3600;
        var m = Math.floor(r / 60);
        var s = r % 60;
        var digits = el.querySelectorAll('.digit');

          digits[1].textContent = fmt(h);
          digits[2].textContent = fmt(m);
          digits[3].textContent = fmt(s);
        }
      }

      update(timerMeet, meetDate);

            schedule(PAUSE_BETWEEN);

          return;
